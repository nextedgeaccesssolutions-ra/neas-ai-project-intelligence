th,\n  });\n}\n\nfunction rememberVersions(b: M.DbBundle) {\n  for (const a of b.activities) versions[vkey('activities', a.id)] = { id: a.id, version: a.version };\n  for (const r of b.reports) versions[vkey('project_reports', r.id)] = { id: r.id, version: r.version };\n  for (const l of b.boq) versions[vkey('boq_lines', l.id)] = { id: l.id, version: l.version };\n  for (const f of b.attachments) versions[vkey('report_attachments', f.id)] = { id: f.id, version: f.version };\n  for (const c of b.costs) versions[vkey('cost_settings', c.project_id)] = { id: c.id, version: c.version };\n  for (const q of b.quotes) versions[vkey('quotations', q.project_id)] = { id: q.id, version: q.version };\n}\n\n/** Load everything this user may see. Records with unsent local changes keep the local copy. */\nexport async function pullAll(): Promise<void> {\n  const sb = supabaseBrowser();\n  if (!sb || !apply || !read) return;\n  const { data: projects, error } = await sb.from('projects').select('*').order('code');\n  if (error) throw error;\n  const bundle: M.DbBundle = { projects: projects as M.DbProject[], activities: [], reports: [], boq: [], costs: [], quotes: [], attachments: [] };\n  for (const p of projects ?? []) {\n    const { data, error: e2 } = await sb.rpc('pull_changes', { p_project: p.id });\n    if (e2) throw e2;\n    const d = data as { activities: M.DbActivity[]; reports: M.DbReport[]; attachments: M.DbAttachment[]; boq_lines: M.DbBoq[]; cost_settings: M.DbCost | null; quotation: M.DbQuote | null };\n    bundle.activities.push(...d.activities);\n    bundle.reports.push(...d.reports);\n    bundle.attachments.push(...d.attachments);\n    bundle.boq.push(...d.boq_lines);\n    if (d.cost_settings) bundle.costs.push(d.cost_settings);\n    if (d.quotation) bundle.quotes.push(d.quotation);\n  }\n  rememberVersions(bundle);\n  await setMeta('versions', versions);\n  const server = M.bundleToState(bundle, read());\n  const local = read();\n  const unsent = new Set((await allOps()).map((o) => o.record_id));\n  const keep = <T extends { id: string }>(srv: T[], loc: T[]) => {\n    const locals = loc.filter((x) => unsent.has(x.id));\n    return [...srv.filter((x) => !unsent.has(x.id)), ...locals];\n  };\n  apply({\n    ...server,\n    activities: keep(server.activities, local.activities),\n    reports: keep(server.reports, local.reports),\n    boq: keep(server.boq, local.boq),\n    evidence: keep(server.evidence, local.evidence),\n    userName: status.profile?.full_name || local.userName,\n  });\n  set({ lastSyncAt: new Date().toISOString(), error: null });\n}\n\n// ---------------------------------------------------------------------------\n// Local change \u2192 outbox\n// ---------------------------------------------------------------------------\nconst same = (a: unknown, b: unknown) => JSON.stringify(a) === JSON.stringify(b);\n\nasync function queueCollection<T extends { id: string; projectId: string }>(entity: Entity, prev: T[], next: T[], toDb: (x: T) => Record<string, unknown>, extra?: (x: T) => Partial<Operation>) {\n  const before = new Map(prev.map((x) => [x.id, x]));\n  const after = new Map(next.map((x) => [x.id, x]));\n  const userId = status.profile?.id ?? '';\n  for (const [id, x] of after) {\n    const old = before.get(id);\n    if (old && same(toDb(old), toDb(x))) continue;\n    await enqueue({ entity, op: 'upsert', record_id: id, project_id: x.projectId, base_version: versions[vkey(entity, id)]?.version ?? null, payload: toDb(x), user_id: userId, ...(old ? {} : extra?.(x)) });\n  }\n  for (const [id, x] of before) {\n    if (after.has(id)) continue;\n    await enqueue({ entity, op: 'delete', record_id: id, project_id: x.projectId, base_version: versions[vkey(entity, id)]?.version ?? null, payload: {}, user_id: userId });\n  }\n}\n\n/** Called by the store after every local change in cloud mode. */\nexport async function cloudOnChange(prev: AppState, next: AppState) {\n  if (status.auth !== 'active' && status.auth !== 'offline_grace') return;\n  const isUuid = (id: string) => /^[0-9a-f-]{36}$/i.test(id);\n  // device-mode ids (e.g. \"act_x1\") are converted: cloud records always use UUIDs\n  await queueCollection('activities', prev.activities, next.activities.filter((a) => isUuid(a.id)), M.activityToDb);\n  await queueCollection('project_reports', prev.reports, next.reports.filter((r) => isUuid(r.id)), M.reportToDb);\n  await queueCollection('boq_lines', prev.boq, next.boq.filter((b) => isUuid(b.id)), M.boqToDb);\n  await queueCollection<Evidence>('report_attachments', prev.evidence, next.evidence.filter((e) => isUuid(e.id)), (e) => M.evidenceToDb({ ...e, storagePath: e.storagePath ?? `${e.projectId}/${e.id}.jpg` }), (e) => ({ blob_key: e.id }));\n  for (const pid of new Set([...Object.keys(next.costSettings), ...Object.keys(prev.costSettings)])) {\n    const a = prev.costSettings[pid], b = next.costSettings[pid];\n    if (b && !same(a, b)) {\n      const known = versions[vkey('cost_settings', pid)];\n      const id = known?.id ?? uuid();\n      versions[vkey('cost_settings', pid)] = known ?? { id, version: 0 };\n      await enqueue({ entity: 'cost_settings', op: 'upsert', record_id: id, project_id: pid, base_version: known?.version ?? null, payload: M.costToDb(b), user_id: status.profile?.id ?? '' });\n    }\n  }\n  for (const pid of new Set([...Object.keys(next.quotations), ...Object.keys(prev.quotations)])) {\n    const a = prev.quotations[pid], b = next.quotations[pid];\n    if (b && !same(a, b)) {\n      const known = versions[vkey('quotations', pid)];\n      const id = known?.id ?? uuid();\n      versions[vkey('quotations', pid)] = known ?? { id, version: 0 };\n      await enqueue({ entity: 'quotations', op: 'upsert', record_id: id, project_id: pid, base_version: known?.version ?? null, payload: M.quoteToDb(b), user_id: status.profile?.id ?? '' });\n    }\n  }\n  await setMeta('versions', versions);\n  scheduleSync(800);\n}\n\n// ---------------------------------------------------------------------------\n// Sending\n// ---------------------------------------------------------------------------\nconst send = async (op: Operation): Promise<ApplyResult> => {\n  const sb = supabaseBrowser();\n  if (!sb) throw new Error('offline');\n  const { data, error } = await sb.rpc('apply_operation', {\n    p_op: { op_id: op.op_id, entity: op.entity, op: op.op, record_id: op.record_id, project_id: op.project_id, base_version: op.base_version, payload: op.payload, client_created_at: op.created_at },\n  });\n  if (error) {\n    const code = (error as { code?: string }).code ?? '';\n    // auth/network/server trouble: retry later; anything else: rejected for review\n    if (!code || code.startsWith('PGRST3') || /fetch|network|timeout|JWT/i.test(error.message)) throw new Error(error.message);\n    return { status: 'rejected', error: error.message };\n  }\n  return data as ApplyResult;\n};\n\nconst upload = async (op: Operation) => {\n  const sb = supabaseBrowser();\n  if (!sb || !op.blob_key) return;\n  const blob = await getPhoto(op.blob_key);\n  if (!blob) throw new Error('Photo is no longer on this device');\n  const path = String(op.payload.storage_path);\n  const { error } = await sb.storage.from(FILES_BUCKET).upload(path, blob, { upsert: true, contentType: blob.type || 'image/jpeg' });\n  if (error && !/exists/i.test(error.message)) throw new Error(error.message);\n};\n\nlet syncTimer: ReturnType<typeof setTimeout> | null = null;\nexport function scheduleSync(ms = 0) {\n  if (syncTimer) clearTimeout(syncTimer);\n  syncTimer = setTimeout(() => void syncNow(), ms);\n}\n\nexport async function syncNow(): Promise<void> {\n  if (typeof navigator !== 'undefined' && !navigator.onLine) return set({ online: false });\n  if (status.auth !== 'active' && status.auth !== 'offline_grace') return;\n  set({ syncing: true });\n  try {\n    const rep = await processOutbox(send, upload);\n    for (const op of rep.applied) {\n      const rec = rep.results.get(op.op_id)?.record as { id?: string; version?: number } | undefined;\n      if (rec?.version != null) {\n        const key = op.entity === 'cost_settings' || op.entity === 'quotations' ? op.project_id : op.record_id;\n        versions[vkey(op.entity, key)] = { id: op.record_id, version: rec.version };\n      }\n    }\n    await setMeta('versions', versions);\n    const left = await allOps();\n    if (!rep.networkError && !left.some((o) => o.status === 'pending')) await pullAll();\n    set({ error: rep.networkError ? 'Connection problem. Will retry automatically.' : null, lastSyncAt: new Date().toISOString() });\n  } catch (e) {\n    set({ error: (e as Error).message });\n  } finally {\n    set({ syncing: false });\n    await refreshCounts();\n  }\n}\n\n/** Use the server's copy for a conflicted record (after the person chose it). */\nexport function applyServerRecord(op: Operation) {\n  if (!apply || !read || !op.server_record) return;\n  const st = read();\n  const r = op.server_record as never;\n  if (op.entity === 'activities') apply({ ...st, activities: st.activities.map((a) => (a.id === op.record_id ? M.activityFromDb(r) : a)) });\n  if (op.entity === 'project_reports') apply({ ...st, reports: st.reports.map((a) => (a.id === op.record_id ? M.reportFromDb(r) : a)) });\n  if (op.entity === 'boq_lines') apply({ ...st, boq: st.boq.map((a) => (a.id === op.record_id ? M.boqFromDb(r) : a)) });\n  const v = Number((op.server_record as { version?: number }).version);\n  if (Number.isFinite(v)) versions[vkey(op.entity, op.entity === 'cost_settings' || op.entity === 'quotations' ? op.project_id : op.record_id)] = { id: op.record_id, version: v };\n}\n\n// ---------------------------------------------------------------------------\n// Session\n// ---------------------------------------------------------------------------\nasync function loadIdentity(): Promise<void> {\n  const sb = supabaseBrowser()!;\n  const { data: u } = await sb.auth.getUser();\n  if (!u.user) return set({ auth: 'signed_out', profile: null, memberships: [] });\n  const { data: profile } = await sb.from('profiles').select('id, email, full_name, global_role, status, email_verified_at, allowed_views').eq('id', u.user.id).single();\n  const { data: memberships } = await sb.from('project_memberships').select('project_id, role, can_approve_reports').eq('user_id', u.user.id);\n  const active = profile?.status === 'active' && !!profile.email_verified_at;\n  await setMeta('identity', { profile, memberships, verified_at: Date.now() });\n  set({ profile: (profile as Profile) ?? null, memberships: (memberships as Membership[]) ?? [], auth: active ? 'active' : 'pending' });\n}\n\n/** Boot in cloud mode. Works offline for a signed-in user within the grace period. */\nexport async function cloudBoot(applyState: (s: AppState) => void, readState: () => AppState) {\n  apply = applyState;\n  read = readState;\n  versions = (await getMeta<Versions>('versions')) ?? {};\n  const sb = supabaseBrowser();\n  if (!sb) return;\n  const online = typeof navigator === 'undefined' || navigator.onLine;\n  set({ online });\n  const { data: sess } = await sb.auth.getSession();\n  if (!sess.session) return set({ auth: 'signed_out' });\n  if (online) {\n    try {\n      await loadIdentity();\n    } catch {\n      set({ error: 'Could not reach the server.' });\n    }\n  }\n  if (!online || status.auth === 'checking') {\n    const id = await getMeta<{ profile: Profile; memberships: Membership[]; verified_at: number }>('identity');\n    const fresh = id && Date.now() - id.verified_at < OFFLINE_GRACE_HOURS * 3600 * 1000;\n    if (id?.profile && fresh && id.profile.status === 'active') set({ auth: 'offline_grace', profile: id.profile, memberships: id.memberships });\n    else set({ auth: 'expired' });\n  }\n  await refreshCounts();\n  onOutboxChange(() => void refreshCounts());\n  if (status.auth === 'active') {\n    await pullAll().catch((e) => set({ error: (e as Error).message }));\n    scheduleSync(0);\n  }\n  window.addEventListener('online', async () => {\n    set({ online: true });\n    if (status.auth === 'offline_grace' || status.auth === 'expired') await loadIdentity().catch(() => undefined);\n    scheduleSync(0);\n  });\n  window.addEventListener('offline', () => set({ online: false }));\n  sb.auth.onAuthStateChange((event) => {\n    if (event === 'SIGNED_OUT') set({ auth: 'signed_out', profile: null, memberships: [] });\n  });\n  if (timer) clearInterval(timer);\n  timer = setInterval(() => {\n    if (navigator.onLine) scheduleSync(0);\n  }, 60_000);\n}\n\n/** Sign out and remove cached project data from this device (unsent changes are kept unless the person discards them). */\nexport async function cloudSignOut(clearCache: () => void) {\n  await supabaseBrowser()?.auth.signOut();\n  await setMeta('identity', null);\n  clearCache();\n  set({ auth: 'signed_out', profile: null, memberships: [] });\n}\n", "lib/cloud/notify.ts": "import 'server-only';\nimport { createHmac } from 'node:crypto';\nimport { sha256 } from './server';\n\n/**\n * Sends a short notice to the NEAS administrator's mailbox through the signed Apps Script bridge\n * (the same one that mirrors data to Google Sheets). The recipient is fixed in the script\n * (ADMIN_EMAIL property, default info.nextedgeaccesssolutions@gmail.com), never taken from a request.\n * Best effort: a failure never blocks the user's action.\n */\nexport async function notifyAdmin(subject: string, text: string, dedupeKey?: string): Promise<boolean> {\n  const url = process.env.SHEETS_WEBHOOK_URL;\n  const secret = process.env.SHEETS_WEBHOOK_SECRET;\n  if (!url || !secret) return false;\n  const payload = JSON.stringify({ notify: { subject: subject.slice(0, 150), text: text.slice(0, 2000) } });\n  const ts = Date.now();\n  const sig = createHmac('sha256', secret).update(`${ts}.${payload}`).digest('hex');\n  try {\n    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ts, sig, key: dedupeKey ? sha256(`notify:${dedupeKey}`) : undefined, payload }), redirect: 'follow' });\n    const j = (await r.json().catch(() => null)) as { ok?: boolean } | null;\n    return !!j?.ok;\n  } catch {\n    return false;\n  }\n}\n", "lib/cloud/server.ts": "import 'server-only';\nimport { createHmac, createHash } from 'node:crypto';\nimport { cookies } from 'next/headers';\nimport { createServerClient } from '@supabase/ssr';\nimport { createClient, type SupabaseClient } from '@supabase/supabase-js';\nimport { DB_SCHEMA, SUPABASE_ANON_KEY, SUPABASE_URL } from './env';\n\n/** Server secrets. Never imported by client components ('server-only' enforces this at build time). */\nconst SERVICE_ROLE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY ?? '';\n/** Key for hashing client IPs. Uses CLIENT_PORTAL_SECRET when set; otherwise a key derived (HMAC,\n *  domain-separated) from the server-only service-role key, so no extra secret has to be typed. */\nconst CLIENT_PORTAL_SECRET =\n  process.env.CLIENT_PORTAL_SECRET ||\n  (SERVICE_ROLE_KEY ? createHmac('sha256', SERVICE_ROLE_KEY).update('neas:client-portal:v1').digest('hex') : '');\n\nexport function requireEnv() {\n  const missing = [\n    ['NEXT_PUBLIC_SUPABASE_URL', SUPABASE_URL],\n    ['NEXT_PUBLIC_SUPABASE_ANON_KEY', SUPABASE_ANON_KEY],\n    ['SUPABASE_SERVICE_ROLE_KEY', SERVICE_ROLE_KEY],\n  ].filter(([, v]) => !v).map(([k]) => k);\n  if (missing.length) throw new HttpError(503, `Server is not configured: ${missing.join(', ')}`);\n}\n\nexport class HttpError extends Error {\n  constructor(public status: number, message: string) {\n    super(message);\n  }\n}\n\n/** Supabase client acting as the signed-in user (RLS applies). */\nexport function supabaseAsUser(): SupabaseClient {\n  const store = cookies();\n  return createServerClient(SUPABASE_URL, SUPABASE_ANON_KEY, {\n    db: { schema: DB_SCHEMA },\n    cookies: {\n      getAll: () => store.getAll(),\n      setAll: (list) => {\n        try {\n          list.forEach(({ name, value, options }) => store.set(name, value, options));\n        } catch {\n          /* called from a server component: cookies are read-only there */\n        }\n      },\n    },\n  }) as unknown as SupabaseClient;\n}\n\n/** Service-role client. Bypasses RLS: use only after an explicit authorization check. */\nexport function supabaseService(): SupabaseClient {\n  requireEnv();\n  return createClient(SUPABASE_URL, SERVICE_ROLE_KEY, { db: { schema: DB_SCHEMA }, auth: { persistSession: false, autoRefreshToken: false } }) as unknown as SupabaseClient;\n}\n\n/** The signed-in, active user, or a 401/403. Authorization itself is enforced again by RLS. */\nexport async function requireUser() {\n  const sb = supabaseAsUser();\n  const { data, error } = await sb.auth.getUser();\n  if (error || !data.user) throw new HttpError(401, 'Sign in required');\n  const { data: active } = await sb.rpc('is_active_user');\n  if (!active) throw new HttpError(403, 'Your account is not active');\n  return { sb, user: data.user };\n}\n\nexport async function requireSuperAdmin() {\n  const ctx = await requireUser();\n  const { data: admin } = await ctx.sb.rpc('is_super_admin');\n  if (!admin) throw new HttpError(403, 'Super Admin only');\n  return ctx;\n}\n\n/** Keyed hash of the caller's IP for throttling without storing raw addresses. */\nexport function ipHash(req: Request): string {\n  const ip = (req.headers.get('x-forwarded-for') ?? '').split(',')[0].trim() || req.headers.get('x-real-ip') || 'unknown';\n  return createHmac('sha256', CLIENT_PORTAL_SECRET || 'unset').update(ip).digest('hex');\n}\n\nexport const sha256 = (s: string) => createHash('sha256').update(s).digest('hex');\n\nexport function appUrl(req: Request): string {\n  return process.env.APP_URL || new URL(req.url).origin;\n}\n\n/** Uniform JSON responses; internal error details are never sent to the browser. */\nexport function handle(fn: (req: Request, ctx: { params: Record<string, string> }) => Promise<Response>) {\n  return async (req: Request, ctx: { params: Record<string, string> }) => {\n    try {\n      return await fn(req, ctx);\n    } catch (e) {\n      if (e instanceof HttpError) return Response.json({ error: e.message }, { status: e.status });\n      console.error('[api]', (e as Error)?.message);\n      return Response.json({ error: 'Something went wrong. Try again.' }, { status: 500 });\n    }\n  };\n}\n\nexport async function readJson<T>(req: Request, max = 64 * 1024): Promise<T> {\n  const text = await req.text();\n  if (text.length > max) throw new HttpError(413, 'Request too large');\n  try {\n    return JSON.parse(text) as T;\n  } catch {\n    throw new HttpError(400, 'Invalid JSON');\n  }\n}\n\n/** Same-origin check for state-changing requests (CSRF defence in depth alongside SameSite cookies). */\nexport function assertSameOrigin(req: Request) {\n  const origin = req.headers.get('origin');\n  if (origin && origin !== new URL(req.url).origin && origin !== process.env.APP_URL) throw new HttpError(403, 'Cross-site request refused');\n}\n", "lib/fieldStatus.ts": "import { actualPct, latestReport, plannedPct } from './calc';\nimport { fmtDate, fmtPct } from './format';\nimport type { Activity, FieldReport } from './types';\n\nexport type Tone = 'ok' | 'warn' | 'bad' | 'muted';\nexport interface ActivityStatus { label: string; tone: Tone; icon: string; detail: string }\n\n/** Plain-language status for one activity, from its latest report against the plan for `day`. */\nexport function activityStatus(a: Activity, reports: FieldReport[], day: string): ActivityStatus {\n  const last = latestReport(a.id, reports, day);\n  const planned = plannedPct(a, day);\n  if (!last) return { label: 'No report yet', tone: 'muted', icon: '\u25cb', detail: `Planned ${fmtPct(planned)} by today` };\n  const actual = actualPct(a.id, reports, day);\n  const detail = `${fmtPct(actual)} actual \u00b7 ${fmtPct(planned)} planned \u00b7 ${fmtDate(last.date)}`;\n  if (last.status === 'rejected') return { label: 'Report rejected', tone: 'bad', icon: '\u2715', detail };\n  if (actual >= 100) return { label: 'Complete', tone: 'ok', icon: '\u2713', detail };\n  if (actual + 5 < planned) return { label: 'Behind schedule', tone: 'warn', icon: '\u26a0', detail };\n  return { label: 'On track', tone: 'ok', icon: '\u2713', detail };\n}\n", "scripts/db-test.sh": "#!/usr/bin/env bash\n# Runs the database acceptance tests on a throwaway local PostgreSQL 16 cluster.\nset -euo pipefail\nROOT=\"$(cd \"$(dirname \"$0\")/..\" && pwd)\"\nPGBIN=\"${PGBIN:-/usr/lib/postgresql/16/bin}\"\nDIR=\"$(mktemp -d)\"\n# initdb refuses to run as root: use an unprivileged account when needed\nRUN=()\nif [ \"$(id -u)\" = \"0\" ]; then RUN=(runuser -u \"${PGUSER_OS:-postgres}\" --); chown \"${PGUSER_OS:-postgres}\" \"$DIR\"; chmod 755 \"$DIR\"; fi\nPORT=\"${PGPORT_TEST:-55432}\"\ncleanup() { \"${RUN[@]}\" \"$PGBIN/pg_ctl\" -D \"$DIR/data\" -m immediate stop >/dev/null 2>&1 || true; rm -rf \"$DIR\"; }\ntrap cleanup EXIT\n\"${RUN[@]}\" \"$PGBIN/initdb\" -D \"$DIR/data\" -U postgres -A trust >/dev/null\n\"${RUN[@]}\" \"$PGBIN/pg_ctl\" -D \"$DIR/data\" -o \"-p $PORT -k $DIR -c listen_addresses=''\" -l \"$DIR/log\" start >/dev/null\nPSQL=(psql -h \"$DIR\" -p \"$PORT\" -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q)\n\"${PSQL[@]}\" -f \"$ROOT/supabase/tests/00_supabase_stub.sql\"\nfor f in \"$ROOT\"/supabase/migrations/*.sql; do\n  echo \"applying $(basename \"$f\")\"\n  \"${PSQL[@]}\" -f \"$f\"\ndone\necho \"re-applying migrations (must be idempotent)\"\nfor f in \"$ROOT\"/supabase/migrations/*.sql; do \"${PSQL[@]}\" -f \"$f\"; done\npsql -h \"$DIR\" -p \"$PORT\" -U postgres -d postgres -X -f \"$ROOT/supabase/tests/10_acceptance.sql\" 2>&1 | tee \"$DIR/out.txt\"\ngrep -qE '^ +[0-9]+ \\| +0$' \"$DIR/out.txt\" || { echo \"DATABASE TESTS FAILED\"; exit 1; }\ngrep -q \"ERROR:\" \"$DIR/out.txt\" && { echo \"DATABASE TESTS FAILED (a test statement errored)\"; grep \"ERROR:\" \"$DIR/out.txt\"; exit 1; }\necho \"DATABASE TESTS PASSED\"\n", "supabase/migrations/20261018000006_user_admin.sql": "-- User administration: session revocation, password-setup tracking, approval/role history.\n-- Additive and idempotent; only touches the neas schema (plus deleting a user's own auth sessions\n-- when an administrator revokes them).\n\nalter table neas.profiles add column if not exists sessions_revoked_at timestamptz;\n\n-- A token issued before the user's sessions were revoked no longer counts, even before it expires.\n-- Supabase puts the issue time in the JWT \"iat\" claim.\ncreate or replace function neas.token_is_current(p_revoked timestamptz) returns boolean\nlanguage sql stable set search_path = neas, extensions as $$\n  select p_revoked is null\n      or coalesce(nullif(auth.jwt() ->> 'iat', '')::bigint, 0) > floor(extract(epoch from p_revoked))::bigint;\n$$;\n\ncreate or replace function neas.is_active_user() returns boolean\nlanguage sql stable security definer set search_path = neas, extensions as $$\n  select exists (\n    select 1 from neas.profiles p\n    where p.id = auth.uid() and p.status = 'active' and p.email_verified_at is not null\n      and neas.token_is_current(p.sessions_revoked_at)\n  );\n$$;\n\ncreate or replace function neas.is_super_admin() returns boolean\nlanguage sql stable security definer set search_path = neas, extensions as $$\n  select exists (\n    select 1 from neas.profiles p\n    where p.id = auth.uid() and p.status = 'active' and p.email_verified_at is not null\n      and p.global_role = 'super_admin' and neas.token_is_current(p.sessions_revoked_at)\n  );\n$$;\n\n-- Ends every session of a user: refresh tokens are deleted (no new access tokens) and access\n-- tokens already issued stop working at the database immediately (iat check above).\ncreate or replace function neas.revoke_user_sessions_(p_user uuid) returns void\nlanguage plpgsql security definer set search_path = neas, extensions as $$\nbegin\n  update neas.profiles set sessions_revoked_at = now() where id = p_user;\n  if to_regclass('auth.sessions') is not null then\n    execute 'delete from auth.sessions where user_id = $1' using p_user;\n  end if;\nend $$;\nrevoke all on function neas.revoke_user_sessions_(uuid) from public, anon, authenticated;\n\ncreate or replace function neas.admin_revoke_sessions(p_user uuid, p_reason text default null)\nreturns void language plpgsql security definer set search_path = neas, extensions as $$\nbegin\n  if not neas.is_super_admin() then raise exception 'Not authorized' using errcode = '42501'; end if;\n  if not exists (select 1 from neas.profiles where id = p_user) then raise exception 'User not found'; end if;\n  perform neas.revoke_user_sessions_(p_user);\n  perform neas.write_audit('account:sessions_revoked', null, 'profiles', p_user::text,\n    jsonb_build_object('reason', left(coalesce(p_reason, ''), 200)));\nend $$;\n\n-- Suspending or rejecting an account also ends its sessions.\ncreate or replace function neas.admin_set_user_status(p_user uuid, p_status neas.account_status, p_reason text default null)\nreturns void language plpgsql security definer set search_path = neas, extensions as $$\nbegin\n  if not neas.is_super_admin() then raise exception 'Not authorized' using errcode = '42501'; end if;\n  if p_user = auth.uid() and p_status <> 'active' then raise exception 'You cannot suspend your own account'; end if;\n  if p_status = 'pending' then raise exception 'Use registration review for pending accounts'; end if;\n  update neas.profiles set status = p_status, status_reason = p_reason where id = p_user;\n  if not found then raise exception 'User not found'; end if;\n  if p_status in ('suspended', 'rejected') then perform neas.revoke_user_sessions_(p_user); end if;\nend $$;\n\n-- Role changes within limits: never your own, and never the last active Super Admin.\ncreate or replace function neas.admin_set_global_role(p_user uuid, p_role neas.global_role)\nreturns void language plpgsql security definer set search_path = neas, extensions as $$\nbegin\n  if not neas.is_super_admin() then raise exception 'Not authorized' using errcode = '42501'; end if;\n  if p_user = auth.uid() and p_role <> 'super_admin' then raise exception 'You cannot remove your own Super Admin role'; end if;\n  if p_role <> 'super_admin' and (select count(*) from neas.profiles where global_role = 'super_admin' and status = 'active' and id <> p_user) = 0 then\n    raise exception 'At least one active Super Admin must remain';\n  end if;\n  update neas.profiles set global_role = p_role where id = p_user;\n  if not found then raise exception 'User not found'; end if;\nend $$;\n\n-- Called by the user right after choosing a password (first setup or reset).\ncreate or replace function neas.mark_password_set() returns void\nlanguage plpgsql security definer set search_path = neas, extensions as $$\nbegin\n  if auth.uid() is null then raise exception 'Sign in required' using errcode = '42501'; end if;\n  update neas.profiles set password_set_at = now() where id = auth.uid();\n  perform neas.write_audit('account:password_set', null, 'profiles', auth.uid()::text, '{}'::jsonb);\nend $$;\n\ngrant execute on function neas.token_is_current(timestamptz) to authenticated;\ngrant execute on function neas.admin_revoke_sessions(uuid, text), neas.mark_password_set() to authenticated;\ngrant execute on function neas.admin_set_user_status(uuid, neas.account_status, text), neas.admin_set_global_role(uuid, neas.global_role) to authenticated;\n", "supabase/migrations/20261018000007_access_control.sql": "-- Access control set by the administrator:\n--   * the owner account (bootstrap admin e-mail) becomes the first Super Admin once verified;\n--     everyone else waits for that admin's approval before they can sign in to the workspace;\n--   * per-user module views (\"which screens can this person use\"), enforced in the database for\n--     the data behind each module, not only by hiding menu items.\n-- Additive and idempotent.\n\n-- ---------------------------------------------------------------------------\n-- Settings (Super Admin only)\n-- ---------------------------------------------------------------------------\ncreate table if not exists neas.app_settings (\n  key text primary key,\n  value text not null,\n  updated_at timestamptz not null default now()\n);\nalter table neas.app_settings enable row level security;\ninsert into neas.app_settings (key, value) values\n  ('bootstrap_admin_email', 'info.nextedgeaccesssolutions@gmail.com'),\n  ('admin_notify_email', 'info.nextedgeaccesssolutions@gmail.com')\non conflict (key) do nothing;\ndrop policy if exists settings_admin on neas.app_settings;\ncreate policy settings_admin on neas.app_settings for all to authenticated\n  using (neas.is_super_admin()) with check (neas.is_super_admin());\ngrant select, insert, update on neas.app_settings to authenticated;\n\n-- The owner e-mail becomes Super Admin only while no active Super Admin exists, and only after\n-- the e-mail address is verified. After that, every new account needs approval.\ncreate or replace function neas.maybe_bootstrap_admin(p_user uuid) returns void\nlanguage plpgsql security definer set search_path = neas, extensions as $$\ndeclare p record;\nbegin\n  select * into p from neas.profiles where id = p_user;\n  if not found or p.email_verified_at is null then return; end if;\n  if lower(p.email) <> lower(coalesce((select value from neas.app_settings where key = 'bootstrap_admin_email'), '')) then return; end if;\n  if exists (select 1 from neas.profiles where global_role = 'super_admin' and status = 'active') then return; end if;\n  update neas.profiles set status = 'active', global_role = 'super_admin', approved_at = now(), status_reason = null where id = p_user;\n  update neas.registration_requests set status = 'active', reviewed_at = now(), reason = 'Owner account' where user_id = p_user and status = 'pending';\n  perform neas.write_audit('account:owner_bootstrapped', null, 'profiles', p_user::text, jsonb_build_object('email', p.email), 'system');\nend $$;\nrevoke all on function neas.maybe_bootstrap_admin(uuid) from public, anon, authenticated;\n\ncreate or replace function neas.handle_new_user() returns trigger\nlanguage plpgsql security definer set search_path = neas, extensions as $$\ndeclare inv record;\nbegin\n  insert into neas.profiles (id, email, full_name, email_verified_at)\n  values (new.id, new.email, coalesce(new.raw_user_meta_data ->> 'full_name', ''), new.email_confirmed_at)\n  on conflict (id) do nothing;\n\n  select * into inv from neas.project_invitations\n  where lower(email) = lower(new.email) and status = 'pending' and expires_at > now()\n  order by created_at desc limit 1;\n\n  if found then\n    update neas.profiles set status = 'active', approved_by = inv.invited_by, approved_at = now(),\n      full_name = case when full_name = '' then inv.full_name else full_name end\n    where id = new.id;\n    insert into neas.project_memberships (project_id, user_id, role, added_by)\n      select i.project_id, new.id, i.role, i.invited_by from neas.project_invitations i\n      where lower(i.email) = lower(new.email) and i.status = 'pending' and i.expires_at > now() and i.project_id is not null\n    on conflict do nothing;\n    update neas.project_invitations set status = 'accepted', accepted_at = now()\n      where lower(email) = lower(new.email) and status = 'pending' and expires_at > now();\n    perform neas.write_audit('account:invited_user_created', null, 'profiles', new.id::text, jsonb_build_object('email', new.email), 'system');\n  else\n    insert into neas.registration_requests (user_id, email, full_name)\n    values (new.id, new.email, coalesce(new.raw_user_meta_data ->> 'full_name', ''));\n    perform neas.write_audit('account:registration_requested', null, 'profiles', new.id::text, jsonb_build_object('email', new.email), 'system');\n    perform neas.maybe_bootstrap_admin(new.id);\n  end if;\n  return new;\nend $$;\n\ncreate or replace function neas.handle_user_verified() returns trigger\nlanguage plpgsql security definer set search_path = neas, extensions as $$\nbegin\n  if new.email_confirmed_at is not null and old.email_confirmed_at is null then\n    update neas.profiles set email_verified_at = new.email_confirmed_at where id = new.id;\n    perform neas.maybe_bootstrap_admin(new.id);\n  end if;\n  return new;\nend $$;\n\n-- ---------------------------------------------------------------------------\n-- Per-user module views\n-- ---------------------------------------------------------------------------\n-- null = every module (the default); otherwise only the listed modules.\nalter table neas.profiles add column if not exists allowed_views text[];\ndo $$\nbegin\n  if not exists (select 1 from pg_constraint where conname = 'profiles_allowed_views_known') then\n    alter table neas.profiles add constraint profiles_allowed_views_known check (\n      allowed_views is null or allowed_views <@ array['overview','estimating','quotation','project_management','field_reports','projects','site_evidence','google_sheets','offline_queue']::text[]\n    );\n  end if;\nend $$;\n\ncreate or replace function neas.can_view(p_view text) returns boolean\nlanguage sql stable security definer set search_path = neas, extensions as $$\n  select neas.is_super_admin() or exists (\n    select 1 from neas.profiles p\n    where p.id = auth.uid() and (p.allowed_views is null or p_view = any (p.allowed_views))\n  ) and neas.is_active_user();\n$$;\ngrant execute on function neas.can_view(text) to authenticated;\n\ncreate or replace function neas.admin_set_views(p_user uuid, p_views text[]) returns void\nlanguage plpgsql security definer set search_path = neas, extensions as $$\nbegin\n  if not neas.is_super_admin() then raise exception 'Not authorized' using errcode = '42501'; end if;\n  update neas.profiles set allowed_views = p_views where id = p_user;\n  if not found then raise exception 'User not found'; end if;\n  perform neas.write_audit('account:views_changed', null, 'profiles', p_user::text,\n    jsonb_build_object('views', coalesce(to_jsonb(p_views), '\"all\"'::jsonb)));\nend $$;\ngrant execute on function neas.admin_set_views(uuid, text[]) to authenticated;\n\n-- Data behind each module follows the module permission (Super Admins always pass).\ndrop policy if exists boq_manager on neas.boq_lines;\ncreate policy boq_manager on neas.boq_lines for all to authenticated\n  using (neas.is_super_admin() or (neas.is_manager(project_id) and (neas.can_view('estimating') or neas.can_view('quotation'))))\n  with check (neas.is_super_admin() or (neas.is_manager(project_id) and neas.can_view('estimating')));\ndrop policy if exists cost_manager on neas.cost_settings;\ncreate policy cost_manager on neas.cost_settings for all to authenticated\n  using (neas.is_super_admin() or (neas.is_manager(project_id) and (neas.can_view('estimating') or neas.can_view('quotation'))))\n  with check (neas.is_super_admin() or (neas.is_manager(project_id) and neas.can_view('estimating')));\ndrop policy if exists quotes_manager on neas.quotations;\ncreate policy quotes_manager on neas.quotations for all to authenticated\n  using (neas.is_super_admin() or (neas.is_manager(project_id) and (neas.can_view('quotation') or neas.can_view('estimating'))))\n  with check (neas.is_super_admin() or (neas.is_manager(project_id) and neas.can_view('quotation')));\n\ndrop policy if exists activities_write on neas.activities;\ncreate policy activities_write on neas.activities for all to authenticated\n  using (neas.is_super_admin() or (neas.is_manager(project_id) and neas.can_view('project_management')))\n  with check (neas.is_super_admin() or (neas.is_manager(project_id) and neas.can_view('project_management')));\n\ndrop policy if exists reports_insert on neas.project_reports;\ncreate policy reports_insert on neas.project_reports for insert to authenticated\n  with check (neas.is_super_admin() or (neas.is_member(project_id) and (neas.can_view('field_reports') or neas.can_view('project_management'))));\n\ndrop policy if exists attachments_insert on neas.report_attachments;\ncreate policy attachments_insert on neas.report_attachments for insert to authenticated\n  with check ((neas.is_super_admin() or (neas.is_member(project_id) and (neas.can_view('site_evidence') or neas.can_view('field_reports'))))\n    and uploaded_by = auth.uid() and not client_visible);\n", "supabase/migrations/20261018000008_one_time_codes.sql": "-- One-time passcodes issued by the administrator.\n--   * Employees: a single-use activation code (expires, hashed). The person enters e-mail + code and\n--     chooses their own password. No e-mail delivery needed; the admin hands the code over directly.\n--   * Clients: a passcode can be one-time (works for one sign-in / one device) or reusable, and the\n--     client session can last up to 30 days so the portal also works offline between visits.\n-- Additive and idempotent.\n\n-- ---------------------------------------------------------------------------\n-- Employees\n-- ---------------------------------------------------------------------------\ncreate table if not exists neas.user_setup_codes (\n  id uuid primary key default gen_random_uuid(),\n  user_id uuid not null references neas.profiles (id) on delete cascade,\n  code_hash text not null,\n  created_by uuid references neas.profiles (id),\n  created_at timestamptz not null default now(),\n  expires_at timestamptz not null,\n  used_at timestamptz,\n  revoked_at timestamptz\n);\ncreate index if not exists user_setup_codes_user_idx on neas.user_setup_codes (user_id) where used_at is null and revoked_at is null;\nalter table neas.user_setup_codes enable row level security;\ndrop policy if exists setup_codes_admin on neas.user_setup_codes;\ncreate policy setup_codes_admin on neas.user_setup_codes for select to authenticated using (neas.is_super_admin());\ngrant select on neas.user_setup_codes to authenticated;\n\ncreate table if not exists neas.setup_code_attempts (\n  id bigint generated always as identity primary key,\n  email text not null,\n  ip_hash text not null,\n  success boolean not null,\n  at timestamptz not null default now()\n);\ncreate index if not exists setup_code_attempts_idx on neas.setup_code_attempts (at desc);\nalter table neas.setup_code_attempts enable row level security; -- no policies: service role only\n\ncreate or replace function neas.random_code_() returns text\nlanguage plpgsql volatile set search_path = neas, extensions as $$\ndeclare\n  alphabet constant text := 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; -- no 0/O/1/I\n  bytes bytea := gen_random_bytes(12);\n  code text := '';\n  i int;\nbegin\n  for i in 0..11 loop\n    code := code || substr(alphabet, (get_byte(bytes, i) % 32) + 1, 1);\n    if i in (3, 7) then code := code || '-'; end if;\n  end loop;\n  return code; -- 12 symbols from 32 \u2248 60 bits\nend $$;\nrevoke all on function neas.random_code_() from public, anon, authenticated;\n\n-- Issues a new code for an approved account; earlier unused codes stop working.\ncreate or replace function neas.admin_issue_setup_code(p_user uuid, p_hours int default 72)\nreturns table (code text, expires_at timestamptz)\nlanguage plpgsql security definer set search_path = neas, extensions as $$\ndeclare c text; exp timestamptz;\nbegin\n  if not neas.is_super_admin() then raise exception 'Not authorized' using errcode = '42501'; end if;\n  if not exists (select 1 from neas.profiles where id = p_user and status = 'active') then\n    raise exception 'Approve or reactivate the account before issuing a code';\n  end if;\n  if p_hours is null or p_hours < 1 or p_hours > 720 then raise exception 'Code lifetime must be 1 to 720 hours'; end if;\n  update neas.user_setup_codes set revoked_at = now() where user_id = p_user and used_at is null and revoked_at is null;\n  c := neas.random_code_();\n  exp := now() + make_interval(hours => p_hours);\n  insert into neas.user_setup_codes (user_id, code_hash, created_by, expires_at)\n    values (p_user, crypt(replace(c, '-', ''), gen_salt('bf', 10)), auth.uid(), exp);\n  perform neas.write_audit('account:setup_code_issued', null, 'profiles', p_user::text, jsonb_build_object('expires_at', exp));\n  return query select c, exp;\nend $$;\ngrant execute on function neas.admin_issue_setup_code(uuid, int) to authenticated;\n\n-- Redeems a code (server route only). Failures return ok=false so attempts are kept for throttling.\ncreate or replace function neas.redeem_setup_code(p_email text, p_code text, p_ip_hash text)\nreturns table (ok boolean, error text, user_id uuid)\nlanguage plpgsql security definer set search_path = neas, extensions as $$\ndeclare\n  prof neas.profiles%rowtype;\n  hit neas.user_setup_codes%rowtype;\n  fails int;\n  generic constant text := 'E-mail or code is not valid, or the code has expired.';\nbegin\n  select count(*) into fails from neas.setup_code_attempts a\n   where not a.success and a.at > now() - interval '15 minutes' and (a.ip_hash = p_ip_hash or a.email = lower(trim(p_email)));\n  if fails >= 5 then\n    return query select false, 'Too many attempts. Try again in 15 minutes.'::text, null::uuid;\n    return;\n  end if;\n  select * into prof from neas.profiles p where lower(p.email) = lower(trim(p_email)) and p.status = 'active';\n  if found then\n    select c.* into hit from neas.user_setup_codes c\n     where c.user_id = prof.id and c.used_at is null and c.revoked_at is null and c.expires_at > now()\n       and c.code_hash = crypt(upper(regexp_replace(p_code, '[^A-Za-z0-9]', '', 'g')), c.code_hash)\n     limit 1;\n  end if;\n  if prof.id is null or hit.id is null then\n    insert into neas.setup_code_attempts (email, ip_hash, success) values (lower(trim(p_email)), p_ip_hash, false);\n    insert into neas.audit_logs (actor_kind, action, target_type, target_id, details)\n      values ('system', 'account:setup_code_failed', 'profiles', prof.id::text, '{}'::jsonb);\n    return query select false, generic, null::uuid;\n    return;\n  end if;\n  update neas.user_setup_codes set used_at = now() where id = hit.id;\n  update neas.profiles set password_set_at = now(), email_verified_at = coalesce(email_verified_at, now()) where id = prof.id;\n  insert into neas.setup_code_attempts (email, ip_hash, success) values (lower(trim(p_email)), p_ip_hash, true);\n  insert into neas.audit_logs (actor_id, actor_kind, action, target_type, target_id) values (prof.id, 'user', 'account:setup_code_used', 'profiles', prof.id::text);\n  return query select true, null::text, prof.id;\nend $$;\nrevoke all on function neas.redeem_setup_code(text, text, text) from public, anon, authenticated;\ngrant execute on function neas.redeem_setup_code(text, text, text) to service_role;\n\n-- ---------------------------------------------------------------------------\n-- Clients\n-- ---------------------------------------------------------------------------\nalter table neas.client_access_credentials add column if not exists max_uses int;\nalter table neas.client_access_credentials add column if not exists use_count int not null default 0;\ndo $$\nbegin\n  if not exists (select 1 from pg_constraint where conname = 'client_creds_max_uses_positive') then\n    alter table neas.client_access_credentials add constraint client_creds_max_uses_positive check (max_uses is null or max_uses > 0);\n  end if;\n  -- client sessions may last up to 30 days (offline use between visits)\n  alter table neas.approved_client_content drop constraint if exists approved_client_content_session_hours_check;\n  if not exists (select 1 from pg_constraint where conname = 'client_session_hours_range') then\n    alter table neas.approved_client_content add constraint client_session_hours_range check (session_hours between 1 and 720);\n  end if;\nend $$;\n\ndrop function if exists neas.admin_create_client_passcode(uuid, text, timestamptz, boolean);\ncreate or replace function neas.admin_create_client_passcode(p_project uuid, p_label text default 'Client access', p_expires_at timestamptz default null, p_revoke_existing boolean default false, p_one_time boolean default false)\nreturns text language plpgsql security definer set search_path = neas, extensions as $$\ndeclare code text;\nbegin\n  if not neas.is_super_admin() then raise exception 'Not authorized' using errcode = '42501'; end if;\n  if not exists (select 1 from neas.projects where id = p_project) then raise exception 'Project not found'; end if;\n  if p_expires_at is not null and p_expires_at <= now() then raise exception 'Expiry must be in the future'; end if;\n  code := neas.random_code_();\n  if p_revoke_existing then\n    update neas.client_access_credentials set revoked_at = now() where project_id = p_project and revoked_at is null;\n    update neas.client_sessions set revoked_at = now() where project_id = p_project and revoked_at is null;\n  end if;\n  insert into neas.client_access_credentials (project_id, label, passcode_hash, created_by, expires_at, max_uses)\n  values (p_project, coalesce(nullif(trim(p_label), ''), 'Client access'), crypt(replace(code, '-', ''), gen_salt('bf', 10)), auth.uid(), p_expires_at,\n          case when p_one_time then 1 end);\n  insert into neas.approved_client_content (project_id) values (p_project) on conflict do nothing;\n  return code;\nend $$;\ngrant execute on function neas.admin_create_client_passcode(uuid, text, timestamptz, boolean, boolean) to authenticated;\n\ncreate or replace function neas.client_login(p_code text, p_passcode text, p_ip_hash text, p_user_agent text default null)\nreturns table (ok boolean, error text, session_token text, project_id uuid, expires_at timestamptz)\nlanguage plpgsql security definer set search_path = neas, extensions as $$\ndeclare\n  proj neas.projects%rowtype;\n  cred neas.client_access_credentials%rowtype;\n  recent_failures int;\n  token text;\n  hours int;\n  generic constant text := 'Invalid project code or passcode';\nbegin\n  select count(*) into recent_failures from neas.client_login_attempts a\n  where a.project_code = upper(p_code) and a.ip_hash = p_ip_hash and not a.success and a.at > now() - interval '15 minutes';\n  if recent_failures >= 5 then\n    insert into neas.audit_logs (actor_kind, action, target_type, details)\n      values ('client', 'client:login_throttled', 'client_portal', jsonb_build_object('code', upper(p_code)));\n    return query select false, 'Too many attempts. Try again in 15 minutes.'::text, null::text, null::uuid, null::timestamptz;\n    return;\n  end if;\n\n  select * into proj from neas.projects pr where pr.code = upper(p_code) and pr.status in ('active', 'completed') and pr.client_portal_enabled;\n  if found then\n    select c.* into cred from neas.client_access_credentials c\n    where c.project_id = proj.id and c.revoked_at is null and (c.expires_at is null or c.expires_at > now())\n      and (c.max_uses is null or c.use_count < c.max_uses)\n      and c.passcode_hash = crypt(upper(regexp_replace(p_passcode, '[^A-Za-z0-9]', '', 'g')), c.passcode_hash)\n      and (c.allowed_ip_hashes is null or p_ip_hash = any (c.allowed_ip_hashes))\n    limit 1\n    for update;\n  end if;\n\n  if proj.id is null or cred.id is null then\n    insert into neas.client_login_attempts (project_code, ip_hash, success) values (upper(p_code), p_ip_hash, false);\n    insert into neas.audit_logs (actor_kind, action, project_id, target_type, details)\n      values ('client', 'client:login_failed', proj.id, 'client_portal', jsonb_build_object('code', upper(p_code)));\n    return query select false, generic, null::text, null::uuid, null::timestamptz;\n    return;\n  end if;\n\n  select coalesce(acc.session_hours, 8) into hours from neas.approved_client_content acc where acc.project_id = proj.id;\n  token := encode(gen_random_bytes(32), 'hex');\n  insert into neas.client_sessions (credential_id, project_id, token_hash, ip_hash, user_agent, expires_at)\n    values (cred.id, proj.id, encode(digest(token, 'sha256'), 'hex'), p_ip_hash, left(p_user_agent, 300), now() + make_interval(hours => coalesce(hours, 8)));\n  update neas.client_access_credentials set last_used_at = now(), use_count = use_count + 1 where id = cred.id;\n  insert into neas.client_login_attempts (project_code, ip_hash, success) values (upper(p_code), p_ip_hash, true);\n  insert into neas.audit_logs (actor_kind, action, project_id, target_type, target_id, details)\n    values ('client', 'client:login', proj.id, 'client_access_credentials', cred.id::text, jsonb_build_object('one_time', cred.max_uses = 1));\n  return query select true, null::text, token, proj.id, now() + make_interval(hours => coalesce(hours, 8));\nend $$;\nrevoke all on function neas.client_login(text, text, text, text) from public, anon, authenticated;\ngrant execute on function neas.client_login(text, text, text, text) to service_role;\n", "supabase/migrations/20261018000009_service_role_grants.sql": "-- Server routes (after-login, admin actions, Sheets export) use the service role directly on\n-- neas tables. The service role is server-only (never sent to browsers) and bypasses RLS by design;\n-- it still needs table privileges in a custom schema. Additive and idempotent.\ngrant usage on schema neas to service_role;\ngrant select, insert, update, delete on all tables in schema neas to service_role;\ngrant usage, select on all sequences in schema neas to service_role;\nalter default privileges in schema neas grant select, insert, update, delete on tables to service_role;\nalter default privileges in schema neas grant usage, select on sequences to service_role;\n", "supabase/tests/00_supabase_stub.sql": "-- Minimal stand-in for the Supabase platform objects the migrations depend on.\n-- Used ONLY for local tests on plain PostgreSQL. Never run this against Supabase.\ndo $$ begin\n  create role anon nologin; exception when duplicate_object then null; end $$;\ndo $$ begin\n  create role authenticated nologin; exception when duplicate_object then null; end $$;\ndo $$ begin\n  create role service_role nologin bypassrls; exception when duplicate_object then null; end $$;\n\ncreate schema if not exists auth;\ncreate table if not exists auth.users (\n  id uuid primary key default gen_random_uuid(),\n  email text not null,\n  raw_user_meta_data jsonb not null default '{}'::jsonb,\n  email_confirmed_at timestamptz,\n  created_at timestamptz not null default now()\n);\ncreate or replace function auth.uid() returns uuid language sql stable as $$\n  select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid\n$$;\n-- auth.jwt(): claims from request.jwt.claims; tests that do not set an \"iat\" get a freshly issued token.\ncreate or replace function auth.jwt() returns jsonb language sql stable as $$\n  select jsonb_build_object('iat', floor(extract(epoch from clock_timestamp()))::bigint + 1)\n         || coalesce(nullif(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb)\n$$;\ncreate table if not exists auth.sessions (id uuid primary key default gen_random_uuid(), user_id uuid not null, created_at timestamptz not null default now());\ngrant usage on schema auth to anon, authenticated, service_role;\ngrant execute on function auth.uid() to anon, authenticated, service_role;\ngrant execute on function auth.jwt() to anon, authenticated, service_role;\n\ncreate schema if not exists storage;\ncreate table if not exists storage.buckets (id text primary key, name text, public boolean default false);\ncreate table if not exists storage.objects (\n  id uuid primary key default gen_random_uuid(),\n  bucket_id text references storage.buckets (id),\n  name text not null,\n  owner uuid default auth.uid()\n);\nalter table storage.objects enable row level security;\ngrant usage on schema storage to authenticated, service_role;\ngrant select, insert, delete on storage.objects to authenticated;\n", "supabase/tests/10_acceptance.sql": "-- NEAS platform acceptance tests (database layer). Run by scripts/db-test.sh on a throwaway\n-- PostgreSQL 16 cluster with the Supabase stub. Each check records PASS/FAIL in test.results.\n\\set QUIET on\n\\pset pager off\ncreate schema test;\ncreate table test.results (n serial, name text, ok boolean, detail text);\ngrant usage on schema test to authenticated, service_role, anon;\ngrant insert, select on test.results to authenticated, service_role, anon;\ngrant usage on sequence test.results_n_seq to authenticated, service_role, anon;\ncreate table test.vars (k text primary key, v text);\ngrant select, insert, update on test.vars to authenticated, service_role, anon;\n\ncreate function test.check(p_name text, p_ok boolean, p_detail text default null) returns void\nlanguage sql security definer as $$ insert into test.results (name, ok, detail) values (p_name, coalesce(p_ok, false), p_detail) $$;\ngrant execute on function test.check(text, boolean, text) to authenticated, service_role, anon;\n\n-- runs SQL as the CURRENT role and passes if it raises\ncreate function test.expect_error(p_name text, p_sql text) returns void language plpgsql as $$\nbegin\n  begin\n    execute p_sql;\n    perform test.check(p_name, false, 'no error raised');\n  exception when others then\n    perform test.check(p_name, true, sqlerrm);\n  end;\nend $$;\ngrant execute on function test.expect_error(text, text) to authenticated, service_role, anon;\n\ncreate function test.v(p text) returns text language sql security definer as $$ select v from test.vars where k = p $$;\ngrant execute on function test.v(text) to authenticated, service_role, anon;\ncreate function test.setv(p text, val text) returns void language sql security definer as $$\n  insert into test.vars values (p, val) on conflict (k) do update set v = excluded.v $$;\ngrant execute on function test.setv(text, text) to authenticated, service_role, anon;\n\n-- ---------------------------------------------------------------------------\n-- Fixtures (as the database owner)\n-- ---------------------------------------------------------------------------\ninsert into auth.users (id, email, raw_user_meta_data, email_confirmed_at) values\n  ('00000000-0000-0000-0000-0000000000a1', 'admin@neas.test', '{\"full_name\":\"Super Admin\"}', now()),\n  ('00000000-0000-0000-0000-0000000000b1', 'pm.a@neas.test', '{\"full_name\":\"PM Alpha\"}', now()),\n  ('00000000-0000-0000-0000-0000000000c1', 'tech.a@neas.test', '{\"full_name\":\"Tech Alpha\"}', now()),\n  ('00000000-0000-0000-0000-0000000000d1', 'tech.b@neas.test', '{\"full_name\":\"Tech Bravo\"}', now()),\n  ('00000000-0000-0000-0000-0000000000e1', 'new.hire@neas.test', '{\"full_name\":\"New Hire\"}', null);\n\n-- bootstrap: the first Super Admin is promoted by the database owner (documented in the manual)\nupdate neas.profiles set global_role = 'super_admin', status = 'active', approved_at = now() where email = 'admin@neas.test';\n\nselect test.check('registration: new sign-ups start as pending', (select count(*) = 4 from neas.profiles where status = 'pending'));\nselect test.check('registration: each sign-up creates a registration request', (select count(*) = (select count(*) from auth.users) from neas.registration_requests where status = 'pending'));\n\n-- ---------------------------------------------------------------------------\n-- Pending accounts have no access\n-- ---------------------------------------------------------------------------\ninsert into neas.projects (id, code, name, status, contract_value, client_portal_enabled) values\n  ('10000000-0000-0000-0000-00000000000a', 'PRJ-2026-001', 'Facade Cleaning Alpha', 'active', 1250000, false),\n  ('10000000-0000-0000-0000-00000000000b', 'PRJ-2026-002', 'Solar Panel Wash Bravo', 'active', 480000, false);\ninsert into neas.project_memberships (project_id, user_id, role) values\n  ('10000000-0000-0000-0000-00000000000a', '00000000-0000-0000-0000-0000000000b1', 'project_manager'),\n  ('10000000-0000-0000-0000-00000000000a', '00000000-0000-0000-0000-0000000000c1', 'employee'),\n  ('10000000-0000-0000-0000-00000000000b', '00000000-0000-0000-0000-0000000000d1', 'employee');\ninsert into neas.activities (id, project_id, name, start_date, end_date, weight, is_milestone) values\n  ('20000000-0000-0000-0000-0000000000a1', '10000000-0000-0000-0000-00000000000a', 'Mobilization', '2026-10-01', '2026-10-04', 10, true),\n  ('20000000-0000-0000-0000-0000000000a2', '10000000-0000-0000-0000-00000000000a', 'Rope access cleaning', '2026-10-05', '2026-10-22', 90, false),\n  ('20000000-0000-0000-0000-0000000000b1', '10000000-0000-0000-0000-00000000000b', 'Panel washing', '2026-10-10', '2026-10-20', 100, false);\ninsert into neas.boq_lines (project_id, description, category, unit, qty, unit_cost) values\n  ('10000000-0000-0000-0000-00000000000a', 'Rope access team', 'Labor', 'day', 18, 9500);\n\nset role authenticated;\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000c1', false);\nselect test.check('pending: unapproved user sees no projects', (select count(*) = 0 from neas.projects));\nselect test.expect_error('pending: unapproved user cannot file a report',\n  $$insert into neas.project_reports (project_id, activity_id, report_date, actual_pct) values ('10000000-0000-0000-0000-00000000000a', '20000000-0000-0000-0000-0000000000a1', '2026-10-03', 50)$$);\nselect test.expect_error('admin functions: non-admin cannot approve registrations',\n  $$select neas.admin_review_registration('00000000-0000-0000-0000-0000000000c1', true)$$);\n\n-- Super Admin approves three accounts and rejects none yet\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\nselect neas.admin_review_registration('00000000-0000-0000-0000-0000000000b1', true);\nselect neas.admin_review_registration('00000000-0000-0000-0000-0000000000c1', true);\nselect neas.admin_review_registration('00000000-0000-0000-0000-0000000000d1', true);\nselect neas.admin_review_registration('00000000-0000-0000-0000-0000000000e1', true);\nselect test.check('approval: admin approval activates accounts', (select count(*) = 5 from neas.profiles where status = 'active'));\n\n-- unverified e-mail stays locked even though approved\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000e1', false);\nselect test.check('verification: approved but unverified e-mail has no access', not neas.is_active_user());\nreset role;\nupdate auth.users set email_confirmed_at = now() where id = '00000000-0000-0000-0000-0000000000e1';\nset role authenticated;\nselect test.check('verification: verifying the e-mail completes activation', neas.is_active_user());\n\n-- ---------------------------------------------------------------------------\n-- Project isolation\n-- ---------------------------------------------------------------------------\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000c1', false);\nselect test.check('isolation: employee A sees only project A', (select array_agg(code) = array['PRJ-2026-001'] from neas.projects));\nselect test.check('isolation: employee A cannot read project B activities', (select count(*) = 0 from neas.activities where project_id = '10000000-0000-0000-0000-00000000000b'));\nselect test.expect_error('isolation: employee A cannot file a report in project B',\n  $$insert into neas.project_reports (project_id, activity_id, report_date, actual_pct) values ('10000000-0000-0000-0000-00000000000b', '20000000-0000-0000-0000-0000000000b1', '2026-10-12', 10)$$);\nupdate neas.activities set weight = 1 where project_id = '10000000-0000-0000-0000-00000000000b';\nreset role;\nselect test.check('isolation: employee A update on project B changed nothing', (select weight = 100 from neas.activities where id = '20000000-0000-0000-0000-0000000000b1'));\nset role authenticated;\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000c1', false);\nselect test.check('confidential: employee cannot read BOQ of own project', (select count(*) = 0 from neas.boq_lines));\nselect test.expect_error('confidential: employee cannot add BOQ lines',\n  $$insert into neas.boq_lines (project_id, description, qty, unit_cost) values ('10000000-0000-0000-0000-00000000000a', 'x', 1, 1)$$);\nselect test.check('confidential: employee cannot read audit log', (select count(*) = 0 from neas.audit_logs));\nselect test.expect_error('confidential: employee cannot change own role', $$update neas.profiles set global_role = 'super_admin' where id = auth.uid()$$);\n\n-- employee files a report; cannot approve it\ninsert into neas.project_reports (id, project_id, activity_id, report_date, actual_pct, notes)\n  values ('30000000-0000-0000-0000-0000000000a1', '10000000-0000-0000-0000-00000000000a', '20000000-0000-0000-0000-0000000000a1', '2026-10-03', 60, 'Anchors installed');\nselect test.check('reports: employee can file a report on own project', (select count(*) = 1 from neas.project_reports));\nselect test.expect_error('reports: employee cannot approve own report',\n  $$update neas.project_reports set status = 'approved' where id = '30000000-0000-0000-0000-0000000000a1'$$);\n\n-- manager of B? none. Employee B cannot see A's report\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000d1', false);\nselect test.check('isolation: employee B cannot see project A reports', (select count(*) = 0 from neas.project_reports));\nselect test.check('isolation: changing the project id in a query does not bypass RLS',\n  (select count(*) = 0 from neas.project_reports where project_id = '10000000-0000-0000-0000-00000000000a'));\n\n-- manager A approves; cannot touch project B\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000b1', false);\nupdate neas.project_reports set status = 'approved', client_visible = true, review_note = 'OK' where id = '30000000-0000-0000-0000-0000000000a1';\nselect  = 'applied', test.v('op1'));\nselect test.setv('op1b', (neas.apply_operation('{\"op_id\":\"40000000-0000-0000-0000-000000000001\",\"entity\":\"project_reports\",\"op\":\"upsert\",\"record_id\":\"30000000-0000-0000-0000-0000000000a2\",\"project_id\":\"10000000-0000-0000-0000-00000000000a\",\"payload\":{\"activity_id\":\"20000000-0000-0000-0000-0000000000a2\",\"report_date\":\"2026-10-06\",\"actual_pct\":15,\"notes\":\"Offline report\",\"status\":\"submitted\"}}'::jsonb))::text);\nselect test.check('sync: retrying the same operation returns the stored result', (test.v('op1b')::jsonb ->> 'duplicate')::boolean);\nselect test.check('sync: retry did not create a duplicate row', (select count(*) = 1 from neas.project_reports where id = '30000000-0000-0000-0000-0000000000a2'));\nselect test.setv('op2', (neas.apply_operation('{\"op_id\":\"40000000-0000-0000-0000-000000000002\",\"entity\":\"project_reports\",\"op\":\"upsert\",\"record_id\":\"30000000-0000-0000-0000-0000000000a2\",\"project_id\":\"10000000-0000-0000-0000-00000000000a\",\"base_version\":1,\"payload\":{\"actual_pct\":25}}'::jsonb))::text);\nselect test.check('sync: update with current version applies and bumps version', test.v('op2')::jsonb -> 'record' ->> 'version' = '2', test.v('op2'));\nselect test.setv('op3', (neas.apply_operation('{\"op_id\":\"40000000-0000-0000-0000-000000000003\",\"entity\":\"project_reports\",\"op\":\"upsert\",\"record_id\":\"30000000-0000-0000-0000-0000000000a2\",\"project_id\":\"10000000-0000-0000-0000-00000000000a\",\"base_version\":1,\"payload\":{\"actual_pct\":99}}'::jsonb))::text);\nselect test.check('sync: stale version is reported as a conflict', test.v('op3')::jsonb ->> 'status' = 'conflict', test.v('op3'));\nselect test.check('sync: conflict did not overwrite the newer server value', (select actual_pct = 25 from neas.project_reports where id = '30000000-0000-0000-0000-0000000000a2'));\nselect test.setv('op4', (neas.apply_operation('{\"op_id\":\"40000000-0000-0000-0000-00000000 ot read passcode hashes', $$select passcode_hash from neas.client_access_credentials$$);\nselect test.check('client: credential is listed for admins without the hash', (select count(*) = 1 from (select id, label from neas.client_access_credentials) c));\nupdate neas.approved_client_content set show_progress = true, show_reports = true, show_milestones = true where project_id = '10000000-0000-0000-0000-00000000000a';\nselect test.expect_error('client: signed-in users cannot call the client login function',\n  $$select * from neas.client_login('PRJ-2026-001', 'AAAA-BBBB-CCCC', 'ip')$$);\n\nreset role;\nset role service_role;\nselect test.check('client: portal disabled \u2192 passcode rejected', (select not ok from neas.client_login('PRJ-2026-001', test.v('code1'), 'ip-1')));\nreset role;\nupdate neas.projects set client_portal_enabled = true where code = 'PRJ-2026-001';\nset role service_role;\nselect test.check('client: wrong passcode rejected with a generic message', (select not ok and error = 'Invalid project code or passcode' from neas.client_login('PRJ-2026-001', 'WRON-GWRO-NGXX', 'ip-1')));\nselect test.check('client: correct passcode for the wrong project rejected', (select not ok from neas.client_login('PRJ-2026-002', test.v('code1'), 'ip-1')));\nselect test.setv('tok1', (select session_token from neas.client_login('prj-2026-001', lower(replace(test.v('code1'), '-', ' ')), 'ip-1') where ok));\nselect test.check('client: valid passcode issues a session (code and spacing tolerant)', length(test.v('tok1')) = 64);\nselect test.setv('snap1', neas.client_snapshot(test.v('tok1'))::text);\nselect test.check('client: snapshot shows the right project', test.v('snap1')::jsonb -> 'project' ->> 'code' = 'PRJ-2026-001');\nselect test.check('client: snapshot hides contract value, BOQ and quotations',\n  not (test.v('snap1') ilike '%contract%' or test.v('snap1') ilike '%boq%' or test.v('snap1') ilike '%unit_cost%' or test.v('snap1') ilike '%quotation%' or test.v('snap1') ilik ent_login('PRJ-2026-001', 'BAD0-BAD0-BAD0', 'ip-9'); end loop; end $$;\nselect test.check('client: throttled after 5 failed attempts, even with the right passcode', (select not ok and error like 'Too many attempts%' from neas.client_login('PRJ-2026-001', test.v('code2'), 'ip-9')));\nselect test.check('client: throttling is per address (others can still sign in)', (select ok from neas.client_login('PRJ-2026-001', test.v('code2'), 'ip-10')));\nreset role;\n\n-- ---------------------------------------------------------------------------\n-- Invitations and audit\n-- ---------------------------------------------------------------------------\ninsert into neas.project_invitations (email, full_name, project_id, role, invited_by)\n  values ('invitee@neas.test', 'Invited Inspector', '10000000-0000-0000-0000-00000000000a', 'employee', '00000000-0000-0000-0000-0000000000a1');\ninsert into auth.users (id, email, email_confirmed_at) values ('00000000-0000-0000-0000-0000000000f1', 'Invitee@NEAS.test', now());\nselect test.check('invitation: invited user is active with project access on first sign-in',\n  (select status = 'active' from neas.profiles where id = '00000000-0000-0000-0000-0000000000f1')\n  and (select count(*) = 1 from neas.project_memberships where user_id = '00000000-0000-0000-0000-0000000000f1'));\nselect test.check('invitation: invitation cannot be reused', (select status = 'accepted' from neas.project_invitations where lower(email) = 'invitee@neas.test'));\n\nselect test.check('audit: approvals, suspensions and client logins are logged',\n  (select count(*) filter (where action = 'update:profiles') >= 5 and count(*) filter (where action = 'client:login') >= 2 and count(*) filter (where action = 'client:login_failed') >= 5 from neas.audit_logs));\nselect test.check('audit: passcode hashes never reach the audit log', (select count(*) = 0 from neas.audit_logs where details::text like '%$2a$%' or details::text ilike '%passcode_hash%'));\n\n\\ir 20_legacy_import.sql\
