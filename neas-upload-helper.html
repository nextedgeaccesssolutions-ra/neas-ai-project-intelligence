st.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\nselect set_config('request.jwt.claims', '', false);\nselect neas.admin_revoke_sessions('00000000-0000-0000-0000-0000000000f2', 'Lost phone');\n\nreset role;\nselect test.check('sessions: refresh sessions are deleted on revoke', (select count(*) = 0 from auth.sessions where user_id = '00000000-0000-0000-0000-0000000000f2'));\nselect test.check('sessions: revocation and password setup are in the audit log',\n  (select count(*) = 1 from neas.audit_logs where action = 'account:sessions_revoked' and target_id = '00000000-0000-0000-0000-0000000000f2')\n  and (select count(*) = 1 from neas.audit_logs where action = 'account:password_set' and target_id = '00000000-0000-0000-0000-0000000000f2'));\nset role authenticated;\n\n-- the old access token stops working at once; a new sign-in works\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000f2', false);\nselect set_config('request.jwt.claims', json_build_object('sub', '00000000-0000-0000-0000-0000000000f2', 'iat', floor(extract(epoch from clock_timestamp()))::bigint - 60)::text, false);\nselect test.check('sessions: token issued before revocation is refused', not neas.is_active_user());\nselect set_config('request.jwt.claims', json_build_object('sub', '00000000-0000-0000-0000-0000000000f2', 'iat', floor(extract(epoch from clock_timestamp()))::bigint + 5)::text, false);\nselect test.check('sessions: signing in again restores access', neas.is_active_user());\n\n-- an old Super Admin token cannot administer either\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\nselect set_config('request.jwt.claims', '', false);\nselect neas.admin_set_global_role('00000000-0000-0000-0000-0000000000f2', 'super_admin');\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000f2', false);\nselect set_config('request.jwt.claims', json_build_object('sub', '00000000-0000-0000-0000-0000000000f2', 'iat', floor(extract(epoch from clock_timestamp()))::bigint + 5)::text, false);\nselect test.check('roles: promoted user is Super Admin with a current token', neas.is_super_admin());\nselect set_config('request.jwt.claims', json_build_object('sub', '00000000-0000-0000-0000-0000000000f2', 'iat', 1)::text, false);\nselect test.check('roles: Super Admin rights also end with a revoked token', not neas.is_super_admin());\n\n-- suspension ends sessions too\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\nselect set_config('request.jwt.claims', '', false);\nselect neas.admin_set_global_role('00000000-0000-0000-0000-0000000000f2', 'staff');\nreset role;\ninsert into auth.sessions (user_id) values ('00000000-0000-0000-0000-0000000000f2');\nupdate neas.profiles set sessions_revoked_at = null where id = '00000000-0000-0000-0000-0000000000f2';\nset role authenticated;\nselect neas.admin_set_user_status('00000000-0000-0000-0000-0000000000f2', 'suspended', 'Contract ended');\nreset role;\nselect test.check('suspension: also signs the user out everywhere',\n  (select sessions_revoked_at is not null from neas.profiles where id = '00000000-0000-0000-0000-0000000000f2')\n  and (select count(*) = 0 from auth.sessions where user_id = '00000000-0000-0000-0000-0000000000f2'));\nset role authenticated;\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000f2', false);\nselect test.expect_error('profiles: users cannot clear their own revocation',\n  $$update neas.profiles set sessions_revoked_at = null where id = '00000000-0000-0000-0000-0000000000f2'$$);\nreset role;\nselect set_config('request.jwt.claims', '', false);\n", "supabase/tests/40_access_control.sql": "-- Owner bootstrap, approval-before-sign-in, and per-user module views.\nreset role;\nselect set_config('request.jwt.claims', '', false);\n\n-- 1. Owner e-mail while a Super Admin already exists: waits for approval like everyone else.\ninsert into auth.users (id, email, raw_user_meta_data, email_confirmed_at) values\n  ('00000000-0000-0000-0000-0000000000a9', 'owner.second@neas.test', '{}', now());\nselect test.check('bootstrap: settings hold the owner e-mail',\n  (select value = 'info.nextedgeaccesssolutions@gmail.com' from neas.app_settings where key = 'bootstrap_admin_email'));\n\n-- 2. Fresh system (no Super Admin): the owner becomes Super Admin only after verifying the e-mail.\ndo $$\ndeclare before_verify text; after_verify text; other text;\nbegin\n  begin\n    update neas.profiles set global_role = 'staff' where global_role = 'super_admin';\n    insert into auth.users (id, email, raw_user_meta_data) values ('00000000-0000-0000-0000-0000000000b9', 'Info.NextEdgeAccessSolutions@gmail.com', '{}');\n    insert into auth.users (id, email, raw_user_meta_data, email_confirmed_at) values ('00000000-0000-0000-0000-0000000000c9', 'someone.else@neas.test', '{}', now());\n    select status || '/' || global_role into before_verify from neas.profiles where id = '00000000-0000-0000-0000-0000000000b9';\n    select status || '/' || global_role into other from neas.profiles where id = '00000000-0000-0000-0000-0000000000c9';\n    update auth.users set email_confirmed_at = now() where id = '00000000-0000-0000-0000-0000000000b9';\n    select status || '/' || global_role into after_verify from neas.profiles where id = '00000000-0000-0000-0000-0000000000b9';\n    raise exception 'rollback-scenario';\n  exception when raise_exception then null;\n  end;\n  perform test.check('bootstrap: owner stays pending until the e-mail is verified', before_verify = 'pending/staff', before_verify);\n  perform test.check('bootstrap: verified owner becomes the first Super Admin', after_verify = 'active/super_admin', after_verify);\n  perform test.check('bootstrap: any other sign-up still waits for approval', other = 'pending/staff', other);\nend $$;\nselect test.check('bootstrap: scenario rolled back cleanly',\n  (select count(*) >= 1 from neas.profiles where global_role = 'super_admin' and status = 'active')\n  and not exists (select 1 from neas.profiles where id = '00000000-0000-0000-0000-0000000000b9'));\n\n-- 3. Pending accounts cannot use the workspace even with a valid sign-in.\nset role authenticated;\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a9', false);\nselect test.check('approval: a signed-in but unapproved user has no workspace access',\n  not neas.is_active_user() and (select count(*) = 0 from neas.projects));\n\n-- 4. Module views\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\ninsert into neas.projects (id, code, name, status) values ('10000000-0000-0000-0000-000000000077', 'PRJ-2026-077', 'Views test', 'active');\nreset role;\ninsert into auth.users (id, email, raw_user_meta_data, email_confirmed_at) values\n  ('00000000-0000-0000-0000-0000000000a7', 'pm.views@neas.test', '{\"full_name\":\"PM Views\"}', now());\nset role authenticated;\nselect neas.admin_review_registration('00000000-0000-0000-0000-0000000000a7', true, null);\ninsert into neas.project_memberships (project_id, user_id, role, can_approve_reports) values\n  ('10000000-0000-0000-0000-000000000077', '00000000-0000-0000-0000-0000000000a7', 'project_manager', true);\ninsert into neas.cost_settings (project_id) values ('10000000-0000-0000-0000-000000000077');\nselect neas.admin_set_views('00000000-0000-0000-0000-0000000000a7', array['overview', 'field_reports']);\nselect test.expect_error('views: unknown module names are refused',\n  $$select neas.admin_set_views('00000000-0000-0000-0000-0000000000a7', array['payroll'])$$);\n\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a7', false);\nselect test.check('views: user sees only the modules given', neas.can_view('field_reports') and not neas.can_view('estimating'));\nselect test.check('views: costing data is hidden without Estimating/Quotation', (select count(*) = 0 from neas.cost_settings where project_id = '10000000-0000-0000-0000-000000000077'));\nselect test.expect_error('views: cannot add BOQ lines without Estimating',\n  $$insert into neas.boq_lines (project_id, description, qty, unit_cost) values ('10000000-0000-0000-0000-000000000077', 'X', 1, 1)$$);\nselect test.expect_error('views: cannot change the schedule without Project management',\n  $$insert into neas.activities (project_id, name, start_date, end_date, weight) values ('10000000-0000-0000-0000-000000000077', 'A', '2026-10-01', '2026-10-02', 10)$$);\ninsert into neas.project_reports (project_id, report_date, actual_pct, notes) values ('10000000-0000-0000-0000-000000000077', '2026-10-18', 10, 'Allowed');\nselect test.check('views: allowed module still works (field report submitted)', (select count(*) = 1 from neas.project_reports where project_id = '10000000-0000-0000-0000-000000000077'));\nselect test.expect_error('views: users cannot change their own module views',\n  $$select neas.admin_set_views('00000000-0000-0000-0000-0000000000a7', null)$$);\n\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\nselect neas.admin_set_views('00000000-0000-0000-0000-0000000000a7', null);\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a7', false);\ninsert into neas.boq_lines (project_id, description, qty, unit_cost) values ('10000000-0000-0000-0000-000000000077', 'Rope access team', 2, 9000);\nselect test.check('views: restoring all modules restores costing access', (select count(*) = 1 from neas.boq_lines where project_id = '10000000-0000-0000-0000-000000000077'));\nreset role;\nselect test.check('views: changes are in the audit log', (select count(*) = 2 from neas.audit_logs where action = 'account:views_changed'));\n", "supabase/tests/50_one_time_codes.sql": "-- One-time codes for employees and clients.\nreset role;\nselect set_config('request.jwt.claims', '', false);\n\n-- ---------- employees ----------\ninsert into auth.users (id, email, raw_user_meta_data, email_confirmed_at) values\n  ('00000000-0000-0000-0000-0000000000e5', 'crew.e5@neas.test', '{\"full_name\":\"Crew Echo\"}', now());\n\nset role authenticated;\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\nselect test.expect_error('setup code: refused for an account that is not approved yet',\n  $$select * from neas.admin_issue_setup_code('00000000-0000-0000-0000-0000000000e5')$$);\nselect neas.admin_review_registration('00000000-0000-0000-0000-0000000000e5', true, null);\nselect test.setv('code_old', (select code from neas.admin_issue_setup_code('00000000-0000-0000-0000-0000000000e5', 72)));\nselect test.setv('code_e5', (select code from neas.admin_issue_setup_code('00000000-0000-0000-0000-0000000000e5', 72)));\nselect test.check('setup code: 12-character code in XXXX-XXXX-XXXX form', test.v('code_e5') ~ '^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$', test.v('code_e5'));\n\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000e5', false);\nselect test.expect_error('setup code: staff cannot issue codes',\n  $$select * from neas.admin_issue_setup_code('00000000-0000-0000-0000-0000000000e5')$$);\nselect test.expect_error('setup code: browsers cannot redeem codes directly',\n  $$select * from neas.redeem_setup_code('crew.e5@neas.test', 'AAAA-BBBB-CCCC', 'ip')$$);\n\nreset role;\nselect test.check('setup code: only a hash is stored', (select bool_and(code_hash like '$2%' and code_hash not like '%' || replace(test.v('code_e5'), '-', '') || '%') from neas.user_setup_codes where user_id = '00000000-0000-0000-0000-0000000000e5'));\nset role service_role;\nselect test.check('setup code: an earlier code stops working when a new one is issued', (select not ok from neas.redeem_setup_code('crew.e5@neas.test', test.v('code_old'), 'ip-e5')));\nselect test.check('setup code: wrong code gives a generic message', (select not ok and error like 'E-mail or code is not valid%' from neas.redeem_setup_code('crew.e5@neas.test', 'WRON-GWRO-NGXX', 'ip-e5')));\nselect test.check('setup code: correct code works once (case and dashes ignored)', (select ok and user_id = '00000000-0000-0000-0000-0000000000e5' from neas.redeem_setup_code('CREW.E5@neas.test', lower(replace(test.v('code_e5'), '-', ' ')), 'ip-e5')));\nselect test.check('setup code: cannot be used a second time', (select not ok from neas.redeem_setup_code('crew.e5@neas.test', test.v('code_e5'), 'ip-e5b')));\nreset role;\nselect test.check('setup code: password setup and use are recorded',\n  (select password_set_at is not null from neas.profiles where id = '00000000-0000-0000-0000-0000000000e5')\n  and (select count(*) = 1 from neas.audit_logs where action = 'account:setup_code_used' and target_id = '00000000-0000-0000-0000-0000000000e5'));\n-- expired codes\nupdate neas.user_setup_codes set used_at = null, expires_at = now() - interval '1 minute' where user_id = '00000000-0000-0000-0000-0000000000e5' and used_at is not null;\nset role service_role;\nselect test.check('setup code: expired code is refused', (select not ok from neas.redeem_setup_code('crew.e5@neas.test', test.v('code_e5'), 'ip-x9')));\n-- throttling: 5 failures from one address lock it for 15 minutes, even for a valid code\nselect neas.redeem_setup_code('nobody@neas.test', 'AAAA-AAAA-AAAA', 'ip-brute') from generate_series(1, 5);\nreset role;\nset role authenticated;\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\nselect test.setv('code_e5c', (select code from neas.admin_issue_setup_code('00000000-0000-0000-0000-0000000000e5', 1)));\nreset role;\nset role service_role;\nselect test.check('setup code: throttled after 5 failed tries from the same address', (select not ok and error like 'Too many attempts%' from neas.redeem_setup_code('crew.e5@neas.test', test.v('code_e5c'), 'ip-brute')));\nreset role;\nset role authenticated;\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\nselect test.setv('code_e5d', (select code from neas.admin_issue_setup_code('00000000-0000-0000-0000-0000000000e5', 24)));\nselect neas.admin_set_user_status('00000000-0000-0000-0000-0000000000e5', 'suspended', 'test');\nreset role;\nset role service_role;\nselect test.check('setup code: a suspended account cannot redeem a valid code', (select not ok and error like 'E-mail or code is not valid%' from neas.redeem_setup_code('crew.e5@neas.test', test.v('code_e5d'), 'ip-fresh')));\nreset role;\n\n-- ---------- clients ----------\nset role authenticated;\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-0000000000a1', false);\ninsert into neas.projects (id, code, name, status, client_portal_enabled) values ('10000000-0000-0000-0000-000000000088', 'PRJ-2026-088', 'Client codes', 'active', true);\nselect test.setv('c_once', neas.admin_create_client_passcode('10000000-0000-0000-0000-000000000088', 'Owner rep', null, false, true));\nselect test.setv('c_multi', neas.admin_create_client_passcode('10000000-0000-0000-0000-000000000088', 'Site team', null, false, false));\nupdate neas.approved_client_content set session_hours = 720 where project_id = '10000000-0000-0000-0000-000000000088';\nselect test.check('client: sessions can last up to 30 days', (select session_hours = 720 from neas.approved_client_content where project_id = '10000000-0000-0000-0000-000000000088'));\nselect test.expect_error('client: sessions longer than 30 days are refused',\n  $$update neas.approved_client_content set session_hours = 721 where project_id = '10000000-0000-0000-0000-000000000088'$$);\nreset role;\nset role service_role;\nselect test.check('client: one-time passcode works the first time (30-day session)', (select ok and expires_at > now() + interval '29 days' from neas.client_login('PRJ-2026-088', test.v('c_once'), 'ip-c1')));\nselect test.check('client: one-time passcode is refused the second time', (select not ok from neas.client_login('PRJ-2026-088', test.v('c_once'), 'ip-c2')));\nselect test.check('client: reusable passcode works more than once',\n  (select ok from neas.client_login('PRJ-2026-088', test.v('c_multi'), 'ip-c3')) and (select ok from neas.client_login('PRJ-2026-088', test.v('c_multi'), 'ip-c3')));\nreset role;\nselect test.check('client: use count is tracked', (select max_uses = 1 and use_count = 1 from neas.client_access_credentials where project_id = '10000000-0000-0000-0000-000000000088' and label = 'Owner rep'));\n\n-- service role (server routes) can read and update profiles and write audit entries\nset role service_role;\nselect test.check('server: service role can read profiles', (select count(*) > 0 from neas.profiles));\nupdate neas.profiles set last_login_at = now() where id = '00000000-0000-0000-0000-0000000000a1';\ninsert into neas.audit_logs (actor_id, action, target_type, target_id) values ('00000000-0000-0000-0000-0000000000a1', 'auth:login', 'profiles', '00000000-0000-0000-0000-0000000000a1');\nselect test.check('server: service role can update profiles and write the audit log', (select count(*) >= 1 from neas.audit_logs where action = 'auth:login'));\nreset role;\n", "tests/walkthrough.test.ts": "import { describe, expect, it } from 'vitest';\nimport { activityStatus } from '../lib/fieldStatus';\nimport type { Activity, FieldReport } from '../lib/types';\n\nconst act: Activity = { id: 'a1', projectId: 'p', name: 'Facade cleaning', start: '2026-10-01', end: '2026-10-10', weight: 50 };\nconst rep = (date: string, pct: number, extra: Partial<FieldReport> = {}): FieldReport =>\n  ({ id: date + pct, projectId: 'p', activityId: 'a1', date, actualPct: pct, notes: '', createdAt: date + 'T00:00:00Z', ...extra });\n\ndescribe('walkthrough report status', () => {\n  it('no report yet', () => expect(activityStatus(act, [], '2026-10-05').label).toBe('No report yet'));\n  it('on track when actual is within 5 pp of plan', () => expect(activityStatus(act, [rep('2026-10-05', 47)], '2026-10-05').label).toBe('On track'));\n  it('behind schedule when more than 5 pp below plan', () => {\n    const s = activityStatus(act, [rep('2026-10-05', 30)], '2026-10-05');\n    expect(s.label).toBe('Behind schedule');\n    expect(s.tone).toBe('warn');\n  });\n  it('complete at 100%', () => expect(activityStatus(act, [rep('2026-10-04', 100)], '2026-10-05').label).toBe('Complete'));\n  it('rejected latest report is flagged', () => expect(activityStatus(act, [rep('2026-10-05', 60, { status: 'rejected' })], '2026-10-05').tone).toBe('bad'));\n});\n"}</script>
<script>

const url = 'https://github.com/nextedgeaccesssolutions-ra/neas-ai-project-intelligence/upload/platform-upgrade-preview';

  if (e.origin !== 'https://github.com') return;
  if (e.data === 'neas-ready' && w) { w.postMessage({ neasFiles: data }, 'https://github.com'); s.textContent = 'Sent ' + Object.keys(data).length + ' files to GitHub.'; }
});
