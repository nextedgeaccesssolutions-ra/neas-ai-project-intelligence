ror.message);\n      break;\n    }\n    default:\n      throw new HttpError(400, 'Unknown action');\n  }\n  return Response.json({ ok: true });\n});\n", "app/api/admin/users/create/route.ts": "import { assertSameOrigin, handle, HttpError, readJson, requireSuperAdmin, supabaseService } from '@/lib/cloud/server';\nimport { checkEmail, checkName, UUID_RE } from '@/lib/cloud/validate';\n\nexport const dynamic = 'force-dynamic';\n\n// Super Admin adds a person directly (no e-mail needed): the account is created approved, optionally\n// given access to one project, and a one-time activation code is returned for the admin to hand over.\nexport const POST = handle(async (req) => {\n  assertSameOrigin(req);\n  const { sb } = await requireSuperAdmin();\n  const body = await readJson<{ fullName?: string; email?: string; projectId?: string; role?: string; hours?: number }>(req, 4096);\n  const n = checkName(body.fullName ?? '');\n  if (!n.ok) throw new HttpError(400, n.error);\n  const e = checkEmail(body.email ?? '');\n  if (!e.ok) throw new HttpError(400, e.error);\n  if (body.projectId && !UUID_RE.test(body.projectId)) throw new HttpError(400, 'Invalid project');\n  const role = body.role === 'project_manager' ? 'project_manager' : 'employee';\n  const hours = Math.min(720, Math.max(1, Math.round(Number(body.hours) || 72)));\n\n  const svc = supabaseService();\n  const { data: created, error } = await svc.auth.admin.createUser({ email: e.email, email_confirm: true, user_metadata: { full_name: n.name } });\n  if (error || !created.user) throw new HttpError(409, 'Could not create the account. If this e-mail already has an account, issue a code from the User directory instead.');\n  const id = created.user.id;\n\n  // approval and code go through the admin's own session, so the database checks Super Admin rights and audits them\n  const { error: apErr } = await sb.rpc('admin_review_registration', { p_user: id, p_approve: true, p_reason: null });\n  if (apErr && !/No pending registration/.test(apErr.message)) throw new HttpError(400, apErr.message);\n  if (body.projectId) {\n    const { error: mErr } = await sb.from('project_memberships').upsert({ project_id: body.projectId, user_id: id, role, can_approve_reports: role === 'project_manager' });\n    if (mErr) throw new HttpError(400, mErr.message);\n  }\n  const { data: codeRows, error: cErr } = await sb.rpc('admin_issue_setup_code', { p_user: id, p_hours: hours });\n  if (cErr) throw new HttpError(400, cErr.message);\n  const row = (Array.isArray(codeRows) ? codeRows[0] : codeRows) as { code: string; expires_at: string };\n  return Response.json({ ok: true, userId: id, code: row.code, expiresAt: row.expires_at });\n});\n", "app/api/auth/after-login/route.ts": "import { assertSameOrigin, handle, HttpError, supabaseAsUser, supabaseService } from '@/lib/cloud/server';\n\nexport const dynamic = 'force-dynamic';\n\n// Records the sign-in time and an audit entry. Called by the app right after a successful login.\nexport const POST = handle(async (req) => {\n  assertSameOrigin(req);\n  const sb = supabaseAsUser();\n  const { data } = await sb.auth.getUser();\n  if (!data.user) throw new HttpError(401, 'Sign in required');\n  const svc = supabaseService();\n  const { data: profile } = await svc.from('profiles').select('status, global_role, email_verified_at').eq('id', data.user.id).single();\n  const approved = profile?.status === 'active' && !!profile?.email_verified_at;\n  if (approved) await svc.from('profiles').update({ last_login_at: new Date().toISOString() }).eq('id', data.user.id);\n  // sign-ins of accounts that are not approved are refused by the app and recorded for the administrator\n  await svc.from('audit_logs').insert({ actor_id: data.user.id, action: approved ? 'auth:login' : 'auth:login_blocked', target_type: 'profiles', target_id: data.user.id, details: approved ? {} : { status: profile?.status ?? 'unknown' } });\n  return Response.json({ ok: true, profile });\n});\n", "app/api/auth/redeem/route.ts": "import { assertSameOrigin, handle, HttpError, ipHash, readJson, supabaseService } from '@/lib/cloud/server';\nimport { checkEmail, checkPassword } from '@/lib/cloud/validate';\n\nexport const dynamic = 'force-dynamic';\n\n// Account activation with a one-time code handed over by the administrator.\n// The code is checked (and used up) in the database; then the person's own password is set.\n// The administrator never sees or chooses the password. One generic message for every failure.\nexport const POST = handle(async (req) => {\n  assertSameOrigin(req);\n  const body = await readJson<{ email?: string; code?: string; password?: string }>(req, 2048);\n  const e = checkEmail(body.email ?? '');\n  const code = (body.code ?? '').slice(0, 40);\n  if (!e.ok || code.replace(/[^A-Za-z0-9]/g, '').length !== 12) throw new HttpError(400, 'Enter your e-mail and the 12-character code from your administrator.');\n  const problems = checkPassword(body.password ?? '');\n  if (problems.length) throw new HttpError(400, `Use ${problems.join('; ')}.`);\n\n  const svc = supabaseService();\n  const { data, error } = await svc.rpc('redeem_setup_code', { p_email: e.email, p_code: code, p_ip_hash: ipHash(req) });\n  if (error) throw new HttpError(500, 'Activation is unavailable right now.');\n  const row = (Array.isArray(data) ? data[0] : data) as { ok: boolean; error: string | null; user_id: string | null } | undefined;\n  if (!row?.ok || !row.user_id) throw new HttpError(row?.error?.startsWith('Too many') ? 429 : 401, row?.error ?? 'E-mail or code is not valid, or the code has expired.');\n\n  const { error: upd } = await svc.auth.admin.updateUserById(row.user_id, { password: body.password!, email_confirm: true });\n  if (upd) throw new HttpError(500, 'Your code was accepted but the password could not be saved. Ask your administrator for a new code.');\n  return Response.json({ ok: true });\n});\n", "app/api/auth/register/route.ts": "import { createClient } from '@supabase/supabase-js';\nimport { appUrl, assertSameOrigin, handle, HttpError, readJson } from '@/lib/cloud/server';\nimport { SUPABASE_ANON_KEY, SUPABASE_URL } from '@/lib/cloud/env';\nimport { checkEmail, checkName } from '@/lib/cloud/validate';\nimport { notifyAdmin } from '@/lib/cloud/notify';\n\nexport const dynamic = 'force-dynamic';\n\n// Registration step 1: name + e-mail. Supabase sends a single-use verification link; the\n// database trigger creates a PENDING profile that a Super Admin must approve. The response is\n// identical whether or not the address is already registered (no account enumeration).\nexport const POST = handle(async (req) => {\n  assertSameOrigin(req);\n  const body = await readJson<{ fullName?: string; email?: string; website?: string }>(req, 4096);\n  if (body.website) return Response.json({ ok: true }); // honeypot field filled by bots\n  const n = checkName(body.fullName ?? '');\n  if (!n.ok) throw new HttpError(400, n.error);\n  const e = checkEmail(body.email ?? '');\n  if (!e.ok) throw new HttpError(400, e.error);\n  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new HttpError(503, 'Registration is not available yet.');\n  const anon = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });\n  const { error } = await anon.auth.signInWithOtp({\n    email: e.email,\n    options: { shouldCreateUser: true, data: { full_name: n.name }, emailRedirectTo: `${appUrl(req)}/auth/callback?next=/account` },\n  });\n  if (error && /rate|too many/i.test(error.message)) throw new HttpError(429, 'Too many requests. Try again in a few minutes.');\n  if (!error) {\n    // tell the administrator; deduplicated per address for an hour so the form cannot spam the inbox\n    await notifyAdmin(\n      'NEAS: new account request waiting for approval',\n      `${n.name} <${e.email}> asked for an account on NEAS Project Control.\\n\\nThey must verify their e-mail first. Then review the request in Control panel \u2192 Pending approvals:\\n${appUrl(req)}/admin#approvals\\n\\nOnly approve people you know work with NEAS.`,\n      e.email,\n    );\n  }\n  return Response.json({ ok: true, message: 'Check your inbox for a verification link. After you verify, an administrator will review your request.' });\n});\n", "app/auth/setup-password/page.tsx": "'use client';\nimport { useEffect, useState } from 'react';\nimport AuthCard from '@/components/AuthCard';\nimport { supabaseBrowser } from '@/lib/cloud/browser';\nimport { checkPassword } from '@/lib/cloud/validate';\n\n// One-time password setup (after approval or invitation) and password reset.\n// The link that brings the user here is single-use and expires; the admin never sees the password.\nexport default function SetupPassword() {\n  const [ready, setReady] = useState<boolean | null>(null);\n  const [pw, setPw] = useState('');\n  const [pw2, setPw2] = useState('');\n  const [error, setError] = useState<string | null>(null);\n  const [done, setDone] = useState(false);\n\n  useEffect(() => {\n    supabaseBrowser()?.auth.getSession().then(({ data }) => setReady(!!data.session));\n  }, []);\n\n  const submit = async (e: React.FormEvent) => {\n    e.preventDefault();\n    const problems = checkPassword(pw);\n    if (problems.length) return setError(`Use ${problems.join('; ')}.`);\n    if (pw !== pw2) return setError('The two passwords do not match.');\n    const { error: err } = await supabaseBrowser()!.auth.updateUser({ password: pw });\n    if (err) return setError('Could not save the password. Request a new link and try again.');\n    // record \"password set\" for the administrator's directory (never the password itself)\n    await supabaseBrowser()!.rpc('mark_password_set').then(() => undefined, () => undefined);\n    await fetch('/api/auth/after-login', { method: 'POST' }).catch(() => undefined);\n    setDone(true);\n  };\n\n  if (ready === false) return <AuthCard title=\"Link expired\" subtitle=\"This password link has expired or was already used. Use \u201cForgot password?\u201d on the sign-in page to get a new one.\" />;\n  if (done) return <AuthCard title=\"Password saved\" subtitle=\"You can now sign in with your e-mail and new password.\"><a className=\"btn btn-primary\" href=\"/\">Continue<\/a><\/AuthCard>;\n  return (\n    <AuthCard title=\"Set your password\" subtitle=\"Choose a password only you know. At least 12 characters, mixing letters, numbers or symbols.\">\n      <form onSubmit={submit} className=\"auth-form\">\n        <label className=\"field\">New password<input id=\"pw1\" className=\"input\" type=\"password\" autoComplete=\"new-password\" value={pw} onChange={(e) => setPw(e.target.value)} /><\/label>\n        <label className=\"field\">Repeat password<input id=\"pw2\" className=\"input\" type=\"password\" autoComplete=\"new-password\" value={pw2} onChange={(e) => setPw2(e.target.value)} /><\/label>\n        {error && <p className=\"bad\" role=\"alert\">{error}<\/p>}\n        <button className=\"btn btn-primary\" disabled={!ready}>Save password<\/button>\n      <\/form>\n    <\/AuthCard>\n  );\n}\n", "app/field-reports/page.tsx": "'use client';\nimport Link from 'next/link';\nimport { useEffect, useState } from 'react';\nimport DataIO, { asPlan } from '@/components/DataIO';\nimport * as IO from '@/lib/moduleIO';\nimport { useCanManage } from '@/components/RoleGate';\nimport { CLOUD } from '@/lib/cloud/env';\nimport { supabaseBrowser } from '@/lib/cloud/browser';\nimport { pullAll } from '@/lib/cloud/cloudSync';\nimport ProjectBar, { Loading, NoProject } from '@/components/ProjectBar';\nimport { useProjectData, useStore } from '@/lib/store';\nimport { useQueryParam } from '@/lib/useQuery';\nimport { actualPct, todayLocal } from '@/lib/calc';\nimport { fmtDate, fmtPct, uid } from '@/lib/format';\nimport { askConfirm } from '@/components/Dialogs';\nimport WalkthroughReport from '@/components/WalkthroughReport';\n\nexport default function FieldReports() {\n  const { ready, project, addReport, deleteReport, addEvidence, state, replaceAll } = useStore();\n  const { pid, activities, reports, evidence } = useProjectData();\n  const actParam = useQueryParam('activity');\n  const reviewer = useCanManage();\n  const review = async (id: string, patch: Record<string, unknown>, label: string) => {\n    const { error: err } = await supabaseBrowser()!.from('project_reports').update(patch).eq('id', id);\n    if (err) return setError(`${label} failed: ${err.message}. Reviews need an internet connection.`);\n    await pullAll().catch(() => undefined);\n    setMsg(`${label}.`);\n  };\n  const [activityId, setActivityId] = useState('');\n  const [date, setDate] = useState(() => todayLocal());\n  const [pct, setPct] = useState('');\n  const [notes, setNotes] = useState('');\n  const [error, setError] = useState<string | null>(null);\n  const [msg, setMsg] = useState<string | null>(null);\n  const [filter, setFilter] = useState('');\n\n  useEffect(() => {\n    if (!ready) return;\n    if (actParam && activities.some((a) => a.id === actParam)) setActivityId(actParam);\n    else if (!activities.some((a) => a.id === activityId)) setActivityId(activities[0]?.id ?? '');\n  }, [ready, actParam, pid]); // eslint-disable-line react-hooks/exhaustive-deps\n\n  if (!ready) return <Loading />;\n  if (!project) return <NoProject />;\n\n  const prev = activityId ? actualPct(activityId, reports, date) : 0;\n  const name = (id: string) => activities.find((a) => a.id === id)?.name ?? '(deleted activity)';\n\n  const save = async () => {\n    const v = Number(pct);\n    if (!activityId) return setError('Choose an activity. Add activities in Project management first.');\n    if (!date) return setError('Report date is required.');\n    if (pct.trim() === '' || !Number.isFinite(v) || v < 0 || v > 100) return setError('Actual completion must be a number from 0 to 100.');\n    if (v < prev && !(await askConfirm(`This is lower than the previous report (${fmtPct(prev)}). Save anyway?`, { danger: false }))) return;\n    addReport({ id: uid('rep'), projectId: pid, activityId, date, actualPct: v, notes: notes.trim(), createdAt: new Date().toISOString() });\n    setMsg(`Saved: ${name(activityId)} at ${fmtPct(v)} on ${fmtDate(date)}.`);\n    setError(null);\n    setPct('');\n    setNotes('');\n  };\n\n  const shown = filter ? reports.filter((r) => r.activityId === filter) : reports;\n\n  return (\n    <>\n      <div className=\"page-head\">\n        <div>\n          <div className=\"eyebrow\">Field operations<\/div>\n          <h1>Field reports<\/h1>\n          <p className=\"lead\">Record cumulative % complete per activity. Each saved report updates the Overview straight away.<\/p>\n        <\/div>\n        <div className=\"form-actions\" style={{ marginTop: 0 }}>\n          <DataIO doc={() => IO.reportsDoc(state, filter)} capture={() => document.getElementById('reports-card')} importColumns={IO.COLS.reports} importSheet=\"Field_Reports\" onImport={(rows) => asPlan(IO.planReports(state, rows), replaceAll)} label=\"field reports\" />\n          <Link className=\"btn btn-sm\" href=\"/site-evidence\">Attach site photos<\/Link>\n        <\/div>\n      <\/div>\n      <ProjectBar />\n\n      <WalkthroughReport\n        pid={pid}\n        projectName={project.name}\n        activities={activities}\n        reports={reports}\n        evidence={evidence}\n        addEvidence={addEvidence}\n        onPick={(id) => {\n          setActivityId(id);\n          setFilter(id);\n          document.getElementById('new-report')?.scrollIntoView({ behavior: 'smooth', block: 'start' });\n        }}\n      />\n\n      <section className=\"card\" id=\"new-report\">\n        <div className=\"card-head\"><h2>New field report<\/h2><span className=\"note\">Saved on this device; works offline.<\/span><\/div>\n        {activities.length === 0 ? (\n          <div className=\"empty\">This project has no activities. <Link href=\"/project-management\">Add activities first<\/Link>.<\/div>\n        ) : (\n          <>\n            <div className=\"form-grid\">\n              <label className=\"field\">\n                Activity\n                <select className=\"input\" value={activityId} onChange={(e) => setActivityId(e.target.value)}>\n                  {activities.map((a) => <option key={a.id} value={a.id}>{a.name}<\/option>)}\n                <\/select>\n              <\/label>\n              <label className=\"field\">\n                Report date\n                <input className=\"input\" type=\"date\" value={date} onChange={(e) => setDate(e.target.value)} />\n              <\/label>\n              <label className=\"field\">\n                Actual completion (%) <span className=\"note\">Previous: {fmtPct(prev)}<\/span>\n                <input className=\"input\" type=\"number\" inputMode=\"decimal\" min=\"0\" max=\"100\" step=\"0.1\" value={pct} onChange={(e) => setPct(e.target.value)} />\n              <\/label>\n              <label className=\"field\">\n                Report notes\n                <input className=\"input\" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder=\"Site work completed / issues\" />\n              <\/label>\n            <\/div>\n            {error && <p className=\"bad\" role=\"alert\">{error}<\/p>}\n            {msg && !error && <p className=\"ok\" role=\"status\">{msg} <Link href=\"/\">See it on the Overview<\/Link><\/p>}\n            <div className=\"form-actions\">\n              <button className=\"btn btn-primary\" onClick={save}>Save field report<\/button>\n              {activityId && <Link className=\"btn\" href={`/site-evidence?activity=${activityId}`}>Add photo for this activity<\/Link>}\n            <\/div>\n          <\/>\n        )}\n      <\/section>\n\n      <section className=\"card\" id=\"reports-card\">\n        <div className=\"card-head\">\n          <h2>Saved reports ({shown.length})<\/h2>\n          <select className=\"input\" style={{ maxWidth: 280 }} value={filter} onChange={(e) => setFilter(e.target.value)} aria-label=\"Filter by activity\">\n            <option value=\"\">All activities<\/option>\n            {activities.map((a) => <option key={a.id} value={a.id}>{a.name}<\/option>)}\n          <\/select>\n        <\/div>\n        {shown.length === 0 ? (\n          <div className=\"empty\">No field reports yet.<\/div>\n        ) : (\n          <div className=\"table-wrap\">\n            <table className=\"tbl\">\n              <thead><tr><th>Date<\/th><th>Activity<\/th><th className=\"num\">Actual<\/th><th>Notes<\/th><th>Saved<\/th>{CLOUD && <th>Review<\/th>}<th /><\/tr><\/thead>\n              <tbody>\n                {shown.map((r) => (\n                  <tr key={r.id}>\n                    <td>{fmtDate(r.date)}<\/td>\n                    <td>{name(r.activityId)}<\/td>\n                    <td className=\"num\">{fmtPct(r.actualPct)}<\/td>\n                    <td>{r.notes || <span className=\"note\">\u2014<\/span>}<\/td>\n                    <td className=\"note\">{new Date(r.createdAt).toLocaleString()}<\/td>\n                    {CLOUD && (\n                      <td style={{ whiteSpace: 'nowrap' }}>\n                        <span className={`pill ${r.status === 'approved' ? 'pill-ok' : r.status === 'rejected' ? 'pill-bad' : 'pill-warn'}`}>{r.status ?? 'pending sync'}<\/span>\n                        {reviewer && r.status === 'submitted' && (\n                          <>{' '}<button className=\"btn btn-sm btn-primary\" onClick={() => review(r.id, { status: 'approved' }, 'Report approved')}>Approve<\/button>{' '}\n                          <button className=\"btn btn-sm\" onClick={() => review(r.id, { status: 'rejected' }, 'Report rejected')}>Reject<\/button><\/>\n                        )}\n                        {reviewer && r.status === 'approved' && (\n                          <label className=\"note\" style={{ display: 'inline-flex', gap: 4, marginLeft: 6 }}>\n                            <input type=\"checkbox\" checked={!!r.clientVisible} onChange={(e) => review(r.id, { client_visible: e.target.checked }, e.target.checked ? 'Shared with client' : 'Hidden from client')} /> client\n                          <\/label>\n                        )}\n                      <\/td>\n                    )}\n                    <td>{(!CLOUD || r.status !== 'approved') && <button className=\"btn btn-sm btn-danger\" onClick={() => askConfirm('Delete this field report?').then((ok) => ok && deleteReport(r.id))}>Delete<\/button>}<\/td>\n                  <\/tr>\n                ))}\n              <\/tbody>\n            <\/table>\n          <\/div>\n        )}\n      <\/section>\n    <\/>\n  );\n}\n", "app/globals.css": ":root {\n  --navy: #071d29;\n  --navy-2: #0e2a3a;\n  --sand: #ebc07e;\n  --gold: #ca9332;\n  --gold-ink: #9a6c1c;\n  --bg: #eef2f5;\n  --panel: #ffffff;\n  --line: #e1e7ec;\n  --ink: #0b1f2a;\n  --muted: #5d6f7b;\n  --planned: #3c7896;\n  --planned-soft: #9db8c6;\n  --ok: #1c7c4a;\n  --ok-bg: #e3f3e9;\n  --warn: #9a6400;\n  --warn-bg: #fdf2dc;\n  --bad: #b3261e;\n  --bad-bg: #fbe7e6;\n  --radius: 12px;\n  --shadow: 0 1px 2px rgba(7, 29, 41, 0.04);\n  --font: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\n:root { color-scheme: light; }\nbody { font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; }\na { color: inherit; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\n\n/* ---------- shell ---------- */\n.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--navy) 236px, var(--bg) 236px); }\n.side { background: var(--navy); color: #fff; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }\n.brand { display: flex; gap: 12px; align-items: center; padding: 20px 18px; border-bottom: 1px solid rgba(255,255,255, st);\n  return {\n    filename: `neas-project-control-all-data-${new Date().toISOString().slice(0, 10)}`,\n    title: 'NEAS Project Control \u2014 all data',\n    meta: [['Projects', String(st.projects.length)], ['Exported', new Date().toLocaleString()]],\n    tables: TAB_NAMES.map((t) => ({ title: t, columns: TABS[t] as Column[], rows: rows[t] })),\n  };\n}\n\nexport default function SheetsSetup() {\n  const { ready, state, replaceAll, resetDemo } = useStore();\n  const sync = useSyncStatus();\n  const [cfg, setCfg] = useState<SyncSettings>({ auto: true, scriptUrl: '', token: '' });\n  const [busy, setBusy] = useState(false);\n  const fileRef = useRef<HTMLInputElement>(null);\n  const backupRef = useRef<HTMLInputElement>(null);\n\n  useEffect(() => setCfg(currentSettings()), [sync.transport]);\n  if (!ready) return <Loading />;\n\n  const copy = STATE_COPY[sync.state] ?? STATE_COPY.checking;\n  const counts = { Projects: state.projects.length, Activities: state.activities.length, Field_Reports: state.reports.length, BOQ: state.boq.length, Cost_Settings: Object.keys(state.costSettings).length, Quotations: Object.keys(state.quotations).length, Site_Evidence: state.evidence.length } as Record<TabName, number>;\n\n  const doSync = async () => {\n    setBusy(true);\n    await syncNow(state, state.userName);\n    setBusy(false);\n  };\n\n  const doPull = async () => {\n    if (!(await askConfirm('Replace the data on this device with what is in the Google Sheet? Changes made here since the last sync will be lost.'))) return;\n    setBusy(true);\n    try {\n      const { state: next, counts: c } = await pullFromSheet(state);\n      replaceAll(next);\n      notify(`Loaded from Google Sheet: ${c.Projects} projects, ${c.Activities} activities, ${c.Field_Reports} reports, ${c.BOQ} BOQ lines.`);\n    } catch (e) {\n      notify(`Could not load: ${(e as Error).message}`);\n    } finally {\n      setBusy(false);\n    }\n  };\n\n  const importWorkbook = async () => {\n    const f = fileRef.current?.files?.[0];\n    if (fileRef.current) fileRef.current.value = '';\n    if (!f) return;\n    try {\n      const books = await readWorkbook(f);\n      const tabs: Partial<Record<TabName, Row[]>> = {};\n      for (const t of TAB_NAMES) {\n        const sheet = Object.keys(books).find((n) => n.toLowerCase() === t.toLowerCase());\n        if (sheet) tabs[t] = gridToRows(TABS[t] as Column[], books[sheet]);\n      }\n      const next = rowsToState(tabs, state);\n      const ok = await askConfirm(`Replace all data with this workbook? ${next.projects.length} projects, ${next.activities.length} activities, ${next.reports.length} field reports, ${next.boq.length} BOQ lines.`);\n      if (!ok) return;\n      replaceAll(next);\n      notify('Workbook imported. The Google Sheet will update automatically.');\n    } catch (e) {\n      notify(`Import failed: ${(e as Error).message}`);\n    }\n  };\n\n  const backup = async () => {\n    const r = await saveFile(`neas-project-control-backup-${new Date().toISOString().slice(0, 10)}.json`, new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' })).catch((e: Error) => (notify(e.message), 'declined'));\n    if (r === 'saved') notify('Backup saved.');\n  };\n\n  const restore = async () => {\n    const f = backupRef.current?.files?.[0];\n    if (backupRef.current) backupRef.current.value = '';\n    if (!f) return;\n    try {\n      const s = JSON.parse(await f.text()) as AppState;\n      if (s.version !== 1 || !Array.isArray(s.projects) || !Array.isArray(s.activities) || !Array.isArray(s.reports)) throw new Error('Not a NEAS Project Control backup file.');\n      if (!(await askConfirm(`Replace all data with the backup (${s.projects.length} projects)? Photos are not included in backups.`))) return;\n      replaceAll({ ...s, boq: s.boq ?? [], costSettings: s.costSettings ?? {}, quotations: s.quotations ?? {}, evidence: [] });\n      notify('Backup restored.');\n    } catch (e) {\n      notify((e as Error).message);\n    }\n  };\n\n  const saveCfg = (next: SyncSettings) => {\n    setCfg(next);\n    saveSettings(next);\n  };\n\n  const copyScript = async () => {\n    try {\n      await navigator.clipboard.writeText(APPS_SCRIPT_CODE);\n      notify('Apps Script code copied.');\n    } catch {\n      notify('Clipboard blocked. Select the code and copy it.');\n    }\n  };\n\n  return (\n    <>\n      <div className=\"page-head\">\n        <div>\n          <div className=\"eyebrow\">Integrations<\/div>\n          <h1>Google Sheets setup<\/h1>\n          <p className=\"lead\">Every change in the app is recorded in the NEAS Google Sheet automatically, one tab per record type.<\/p>\n        <\/div>\n        <div className=\"form-actions\" style={{ marginTop: 0 }}>\n          <DataIO doc={() => workbookDoc(state)} label=\"records\" />\n          <a className=\"btn btn-sm btn-primary\" href={SHEET_URL} target=\"_blank\" rel=\"noreferrer\">Open Google Sheet \u2197<\/a>\n        <\/div>\n      <\/div>\n\n      {CLOUD ? (\n        <section className=\"card\">\n          <div className=\"card-head\"><h2>Live sync<\/h2><span className=\"pill pill-ok\"><span className=\"dot\" />Server-managed<\/span><\/div>\n          <p style={{ marginTop: 0 }}>In the cloud version the database is the system of record. The server copies all projects, schedules, reports, BOQ, quotations, photos list, users and memberships to the NEAS Google Sheet every 15 minutes through a signed Apps Script bridge. Duplicate runs are skipped automatically.<\/p>\n          <p className=\"note\">Super Admins can run it immediately from Control panel \u2192 Synchronization. Passcodes, passwords and tokens are never sent to the sheet.<\/p>\n        <\/section>\n      ) : (\n      <section className=\"card\">\n        <div className=\"card-head\">\n          <h2>Live sync<\/h2>\n          <span className={`pill ${copy.tone}`}><span className=\"dot\" />{copy.label}<\/span>\n        <\/div>\n        <div className=\"kv\" style={{ maxWidth: 640 }}>\n          <span className=\"note\">Connection<\/span>\n          <span>{sync.transport === 'connector' ? 'Google Sheets connector (your Google account)' : sync.transport === 'apps-script' ? 'Apps Script web app' : '\u2014'}<\/span>\n          <span className=\"note\">Last successful sync<\/span>\n          <span>{sync.at ? new Date(sync.at).toLocaleString() : 'Not yet'}<\/span>\n          <span className=\"note\">Recorded as<\/span>\n          <span>{state.userName || <span className=\"note\">Set your name on the Quotation page<\/span>}<\/span>\n        <\/div>\n        {sync.message && <p className={sync.state === 'error' ? 'bad' : 'note'} role=\"status\">{sync.message}<\/p>}\n        <div className=\"form-actions\">\n          <button className=\"btn btn-primary\" onClick={doSync} disabled={busy || sync.state === 'syncing' || sync.state === 'unavailable'}>Sync now<\/button>\n          <button className=\"btn\" onClick={doPull} disabled={busy || sync.state === 'unavailable'}>Load from Google Sheet<\/button>\n          <label className=\"field\" style={{ flexDirection: 'row', alignItems: 'center', gap: 8 }}>\n            <input id=\"auto-sync\" type=\"checkbox\" checked={cfg.auto} onChange={(e) => saveCfg({ ...cfg, auto: e.target.checked })} />\n            Sync automatically after every change\n          <\/label>\n        <\/div>\n        <p className=\"note\">\n          The app rewrites each tab with its current records, so the sheet always matches the app and nothing is duplicated. Edit records in the app; if someone edits the sheet,\n          use \u201cLoad from Google Sheet\u201d to bring those edits in. Photos stay on the device that took them; their details are listed in the Site_Evidence tab.\n        <\/p>\n      <\/section>\n      )}\n\n      <section className=\"card\">\n        <div className=\"card-head\"><h2>Sheet tabs<\/h2><span className=\"note\">Rows sent on the next sync<\/span><\/div>\n        <div className=\"table-wrap\">\n          <table className=\"tbl\">\n            <thead><tr><th>Tab<\/th><th>Contents<\/th><th className=\"num\">Rows<\/th><\/tr><\/thead>\n            <tbody>\n              {TAB_NAMES.map((t) => (\n                <tr key={t}>\n                  <td><code>{t}<\/code><\/td>\n                  <td className=\"note\">{(TABS[t] as Column[]).map((c) => c.label).join(' \u00b7 ')}<\/td>\n                  <td className=\"num\">{counts[t]}<\/td>\n                <\/tr>\n              ))}\n              <tr><td><code>Sync_Info<\/code><\/td><td className=\"note\">Last sync time, who synced, record counts<\/td><td className=\"num\">\u2014<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n\n      {!CLOUD && (\n      <section className=\"card\">\n        <div className=\"card-head\"><h2>Import a full workbook<\/h2><span className=\"note\">Excel file with the same tab names<\/span><\/div>\n        <p className=\"note\" style={{ marginTop: 0 }}>Use an Excel export from this page (or a download of the Google Sheet as .xlsx). This replaces all records on this device.<\/p>\n        <div className=\"form-actions\" style={{ marginTop: 0 }}>\n          <input ref={fileRef} id=\"wb-file\" type=\"file\" accept=\".xlsx\" className=\"input\" style={{ maxWidth: 320 }} aria-label=\"Workbook file\" />\n          <button className=\"btn\" onClick={importWorkbook}>Import workbook<\/button>\n        <\/div>\n      <\/section>\n      )}\n\n      {!IS_ARTIFACT && !CLOUD && (\n        <section className=\"card\">\n          <div className=\"card-head\"><h2>Apps Script connection<\/h2><span className=\"note\">For the version hosted outside Claude<\/span><\/div>\n          <ol className=\"note\" style={{ marginTop: 0, paddingLeft: 18 }}>\n            <li>Create an Apps Script project (<a href=\"https://script.google.com/create\" target=\"_blank\" rel=\"noreferrer\">script.google.com<\/a>) and paste the code below.<\/li>\n            <li>Run <code>createToken<\/code> once; copy the token it shows in the execution log.<\/li>\n            <li>Deploy \u2192 New deployment \u2192 Web app \u2192 Execute as <b>Me<\/b>, access <b>Anyone<\/b>. Copy the <b>Web app URL ending in /exec<\/b> (not the editor address) and paste it and the token here.<\/li>\n          <\/ol>\n          <div className=\"form-grid\">\n            <label className=\"field\" style={{ gridColumn: 'span 2' }}>Web app URL\n              <input id=\"script-url\" className=\"input\" value={cfg.scriptUrl} placeholder=\"https://script.google.com/macros/s/\u2026/exec\" onChange={(e) => setCfg({ ...cfg, scriptUrl: e.target.value.trim() })} />\n            <\/label>\n            <label className=\"field\">Token\n              <input id=\"script-token\" className=\"input\" type=\"password\" value={cfg.token} onChange={(e) => setCfg({ ...cfg, token: e.target.value })} />\n            <\/label>\n          <\/div>\n          <div className=\"form-actions\">\n            <button className=\"btn btn-primary\" onClick={() => {\n              const bad = checkScriptUrl(cfg.scriptUrl);\n              if (bad) return notify(bad);\n              if (!cfg.token.trim()) return notify('Paste the token too (run createToken in the Apps Script to see it).');\n              saveCfg({ ...cfg, token: cfg.token.trim() });\n              notify('Connection saved. Press Sync now to test it.');\n            }}>Save connection<\/button>\n            <button className=\"btn\" onClick={copyScript}>Copy Apps Script code<\/button>\n          <\/div>\n          <details style={{ marginTop: 12 }}>\n            <summary className=\"note\">Show Apps Script code<\/summary>\n            <code className=\"block\">{APPS_SCRIPT_CODE}<\/code>\n          <\/details>\n        <\/section>\n      )}\n\n      <section className=\"card\">\n        <div className=\"card-head\"><h2>Backup and restore<\/h2><span className=\"note\">Device data; photos are not included<\/span><\/div>\n        <div className=\"form-actions\" style={{ marginTop: 0 }}>\n          <button className=\"btn btn-primary\" onClick={backup}>Download backup (.json)<\/button>\n          {!CLOUD && <>\n          <input ref={backupRef} id=\"backup-file\" type=\"file\" accept=\"application/json,.json\" className=\"input\" style={{ maxWidth: 320 }} aria-label=\"Backup file\" />\n          <button className=\"btn\" onClick={restore}>Restore from backup<\/button>\n          <button className=\"btn btn-danger\" onClick={() => askConfirm('Reset this device to the starting sample data? Everything entered here will be lost.').then((ok) => ok && resetDemo())}>Reset to starting data<\/button>\n          <\/>}\n        <\/div>\n      <\/section>\n    <\/>\n  );\n}\n", "app/login/page.tsx": "'use client';\nimport Link from 'next/link';\nimport { useState } from 'react';\nimport AuthCard from '@/components/AuthCard';\nimport { supabaseBrowser } from '@/lib/cloud/browser';\nimport { CLOUD } from '@/lib/cloud/env';\n\nexport default function LoginPage() {\n  const [email, setEmail] = useState('');\n  const [password, setPassword] = useState('');\n  const [error, setError] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n  const [resetSent, setResetSent] = useState(false);\n\n  if (!CLOUD) return <AuthCard title=\"Sign-in not set up\" subtitle=\"This copy runs in device mode. Connect Supabase to enable accounts.\"><Link className=\"btn\" href=\"/\">Open the app<\/Link><\/AuthCard>;\n\n  const submit = async (e: React.FormEvent) => {\n    e.preventDefault();\n    setBusy(true);\n    setError(null);\n    const sb = supabaseBrowser()!;\n    const { error: err } = await sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });\n    if (err) {\n      setBusy(false);\n      // one message for every failure so the form never reveals whether an address is registered\n      return setError(/rate|too many/i.test(err.message) ? 'Too many attempts. Wait a few minutes and try again.' : 'E-mail or password is incorrect, or the account is not active yet.');\n    }\n    const r = await fetch('/api/auth/after-login', { method: 'POST' }).then((x) => x.json()).catch(() => null);\n    const p = r?.profile;\n    if (p?.status === 'active' && p?.email_verified_at) {\n      window.location.href = p.global_role === 'super_admin' ? '/admin' : '/';\n      return;\n    }\n    // Only accounts approved by the administrator may sign in to the workspace.\n    await sb.auth.signOut().catch(() => undefined);\n    setBusy(false);\n    setError(\n      p?.status === 'pending' ? 'Your account is waiting for approval by the NEAS administrator. You will receive an e-mail when it is approved.'\n        : p?.status === 'suspended' ? 'This account is suspended. Contact the NEAS administrator.'\n        : p?.status === 'rejected' ? 'This registration was not approved. Contact the NEAS administrator.'\n        : 'E-mail or password is incorrect, or the account is not active yet.',\n    );\n  };\n\n  const forgot = async () => {\n    if (!email.trim()) return setError('Enter your e-mail first.');\n    await supabaseBrowser()!.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: `${location.origin}/auth/callback?next=/auth/setup-password` });\n    setResetSent(true);\n  };\n\n  return (\n    <AuthCard title=\"Sign in\" subtitle=\"Employees and project managers. Clients use the project link and passcode they were given.\">\n      <form onSubmit={submit} className=\"auth-form\">\n        <label className=\"field\">E-mail<input id=\"login-email\" className=\"input\" type=\"email\" autoComplete=\"username\" required value={email} onChange={(e) => setEmail(e.target.value)} /><\/label>\n        <label className=\"field\">Password<input id=\"login-password\" className=\"input\" type=\"password\" autoComplete=\"current-password\" required value={password} onChange={(e) => setPassword(e.target.value)} /><\/label>\n        {error && <p className=\"bad\" role=\"alert\">{error}<\/p>}\n        {resetSent && <p className=\"ok\" role=\"status\">If that address has an account, a reset link is on its way.<\/p>}\n        <button className=\"btn btn-primary\" disabled={busy}>{busy ? 'Signing in\u2026' : 'Sign in'}<\/button>\n      <\/form>\n      <div className=\"auth-links\">\n        <button className=\"linklike\" onClick={forgot}>Forgot password?<\/button>\n        <Link className=\"linklike\" href=\"/activate\">Have a one-time code?<\/Link>\n        <Link href=\"/register\">Request an account<\/Link>\n      <\/div>\n    <\/AuthCard>\n  );\n}\n", "app/site-evidence/page.tsx": "'use client';\nimport Link from 'next/link';\nimport { useEffect, useRef, useState } from 'react';\nimport ProjectBar, { Loading, NoProject } from '@/components/ProjectBar';\nimport { useProjectData, useStore } from '@/lib/store';\nimport { useQueryParam } from '@/lib/useQuery';\nimport { compressImage, getPhoto, putPhoto } from '@/lib/photos';\nimport DataIO from '@/components/DataIO';\nimport * as IO from '@/lib/moduleIO';\nimport { uid } from '@/lib/format';\nimport { askConfirm, notify } from '@/components/Dialogs';\nimport type { Evidence } from '@/lib/types';\nimport PhotoThumb from '@/components/PhotoThumb';\n\nconst MAX_BYTES = 5 * 1024 * 1024;\n\nconst Thumb = ({ id, alt }: { id: string; alt: string }) => <PhotoThumb id={id} alt={alt} />;\n\nexport default function SiteEvidence() {\n  const { ready, project, addEvidence, deleteEvidence, state } = useStore();\n  const { pid, activities, evidence } = useProjectData();\n  const actParam = useQueryParam('activity');\n  const [activityId, setActivityId] = useState('');\n  const [kind, setKind] = useState<Evidence['kind']>('Before');\n  const [caption, setCaption] = useState('');\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState<string | null>(null);\n  const [filter, setFilter] = useState('');\n  const fileRef = useRef<HTMLInputElement>(null);\n\n  useEffect(() => {\n    if (!ready) return;\n    if (actParam && activities.some((a) => a.id === actParam)) setActivityId(actParam);\n    else if (!activities.some((a) => a.id === activityId)) setActivityId(activities[0]?.id ?? '');\n  }, [ready, actParam, pid]); // eslint-disable-line react-hooks/exhaustive-deps\n\n  if (!ready) return <Loading />;\n  if (!project) return <NoProject />;\n\n  const name = (id: string) => activities.find((a) => a.id === id)?.name ?? '(deleted activity)';\n\n  /** Compress and store photos for the chosen activity (form or Import). */\n  const addPhotos = async (files: File[]) => {\n    if (!activityId) return setError('Choose an activity first.');\n    if (!files.length) return setError('Choose or capture a photo.');\n    setBusy(true);\n    let ok = 0;\n    const problems: string[] = [];\n    for (const file of files) {\n      if (!file.type.startsWith('image/')) { problems.push(`${file.name}: not an image`); continue; }\n      if (file.size > MAX_BYTES * 4) { problems.push(`${file.name}: over 20 MB`); continue; }\n      try {\n        const blob = await compressImage(file);\n        if (blob.size > MAX_BYTES) throw new Error('still over 5 MB after compression');\n        const id = uid('ev');\n        await putPhoto(id, blob);\n        addEvidence({ id, projectId: pid, activityId, kind, caption: caption.trim() || file.name.replace(/\\.[^.]+$/, ''), takenAt: new Date(file.lastModified || Date.now()).toISOString(), bytes: blob.size });\n        ok++;\n      } catch (e) {\n        problems.push(`${file.name}: ${e instanceof Error ? e.message : 'could not be saved'}`);\n      }\n    }\n    setBusy(false);\n    setCaption('');\n    if (fileRef.current) fileRef.current.value = '';\n    setError(problems.length ? `${ok} photo(s) added. ${problems.join('; ')}` : null);\n    if (ok) notify(`${ok} photo(s) added to ${name(activityId)}.`);\n  };\n  const attach = () => addPhotos(Array.from(fileRef.current?.files ?? []));\n\n  const evidenceDoc = async () => {\n    const images: { caption: string; blob: Blob }[] = [];\n    for (const e of shown) {\n      const b = await getPhoto(e.id).catch(() => undefined);\n      if (b) images.push({ caption: `${e.kind} \u00b7 ${name(e.activityId)}${e.caption ? ' \u00b7 ' + e.caption : ''} \u00b7 ${new Date(e.takenAt).toLocaleString()}`, blob: b });\n    }\n    return IO.evidenceDoc(state, images);\n  };\n\n  const shown = filter ? evidence.filter((e) => e.activityId === filter) : evidence;\n\n  return (\n    <>\n      <div className=\"page-head\">\n        <div>\n          <div className=\"eyebrow\">Field operations<\/div>\n          <h1>Site evidence<\/h1>\n          <p className=\"lead\">Before, during and after photos per activity. Photos are compressed and kept on this device.<\/p>\n        <\/div>\n        <div className=\"form-actions\" style={{ marginTop: 0 }}>\n          <DataIO doc={evidenceDoc} capture={() => document.getElementById('evidence-card')} extraAccept=\"image/jpeg,image/png,image/webp,image/heic\" onExtraFiles={addPhotos} label=\"photos\" />\n          <Link className=\"btn btn-sm\" href=\"/field-reports\">Field reports<\/Link>\n        <\/div>\n      <\/div>\n      <ProjectBar />\n\n      <section className=\"card\">\n        <div className=\"card-head\"><h2>Attach photo<\/h2><span className=\"note\">Up to 5 MB after compression \u00b7 stored in this browser<\/span><\/div>\n        {activities.length === 0 ? <div className=\"empty\">Add activities in <Link href=\"/project-management\">Project management<\/Link> first.<\/div> : (\n          <>\n            <div className=\"form-grid\">\n              <label className=\"field\">Activity\n                <select className=\"input\" value={activityId} onChange={(e) => setActivityId(e.target.value)}>\n                  {activities.map((a) => <option key={a.id} value={a.id}>{a.name}<\/option>)}\n                <\/select>\n              <\/label>\n              <label className=\"field\">Photo type\n                <select class l-warn'}`}>{e.kind}<\/span> {name(e.activityId)}<\/span>\n                  <span>{e.caption || <span className=\"note\">No caption<\/span>}<\/span>\n                  <span className=\"note\">{new Date(e.takenAt).toLocaleString()} \u00b7 {(e.bytes / 1024).toFixed(0)} KB<\/span>\n                  <button className=\"btn btn-sm btn-danger\" onClick={() => askConfirm('Delete this photo from this device?').then((ok) => ok && deleteEvidence(e.id))}>Delete<\/button>\n                <\/figcaption>\n              <\/figure>\n            ))}\n          <\/div>\n        )}\n      <\/section>\n    <\/>\n  );\n}\n", "components/PhotoThumb.tsx": "'use client';\nimport { useEffect, useState } from 'react';\nimport { getPhoto } from '@/lib/photos';\n\n/** Shows a photo stored on this device (IndexedDB) by evidence id. */\nexport default function PhotoThumb({ id, alt, className }: { id: string; alt: string; className?: string }) {\n  const [url, setUrl] = useState<string | null>(null);\n  const [missing, setMissing] = useState(false);\n  useEffect(() => {\n    let u: string | null = null;\n    setUrl(null);\n    setMissing(false);\n    getPhoto(id)\n      .then((b) => {\n        if (!b) return setMissing(true);\n        u = URL.createObjectURL(b);\n        setUrl(u);\n      })\n      .catch(() => setMissing(true));\n    return () => { if (u) URL.revokeObjectURL(u); };\n  }, [id]);\n  if (missing) return <div className={`thumb-missing ${className ?? ''}`}>Photo not on this device<\/div>;\n  // eslint-disable-next-line @next/next/no-img-element\n  return url ? <img className={className} src={url} alt={alt} /> : <div className={`thumb-loading ${className ?? ''}`} />;\n}\n", "components/Shell.tsx": "'use client';\nimport Link from 'next/link';\nimport { usePathname } from 'next/navigation';\nimport { useEffect, useState, type ReactNode } from 'react';\nimport { useStore } from '@/lib/store';\nimport DialogHost, { IS_ARTIFACT } from '@/components/Dialogs';\nimport { useSyncStatus } f ding') window.location.replace('/account');\n  }, [cloud.auth]);\n  if (CLOUD && cloud.auth !== 'active' && cloud.auth !== 'offline_grace') {\n    return <div className=\"auth-wrap\"><div className=\"auth-card note\">{cloud.auth === 'checking' ? 'Checking your access\u2026' : 'Redirecting to sign in\u2026'}<\/div><\/div>;\n  }\n  const isAdmin = CLOUD && cloud.profile?.global_role === 'super_admin';\n  const nav = NAV.filter((n) => !CLOUD || ((!MANAGER_ONLY.has(n.href) || canManage(state.activeProjectId)) && canView(viewOfPath(n.href), cloud.profile)));\n  const blocked = CLOUD && !pathname.startsWith('/admin') && !canView(viewOfPath(pathname), cloud.profile);\n  const allowedLinks = VIEWS.filter(([k]) => canView(k, cloud.profile));\n\n  return (\n    <div className=\"shell\">\n      <aside className={`side${open ? ' open' : ''}`} aria-label=\"Main navigation\">\n        <Link href=\"/\" className=\"brand\">\n          <span className=\"brand-mark\">NE<\/span>\n          <span>\n            <div className=\"brand-name\">NEAS INTELLIGENCE<\/div>\n            <div className=\"brand-sub\">PROJECT CONTROL<\/div>\n          <\/span>\n        <\/Link>\n        <div className=\"side-label\">WORKSPACE<\/div>\n        <nav className=\"nav\">\n          {nav.map((n) => (\n            <Link key={n.href} href={n.href} aria-current={n.href === current.href && !pathname.startsWith('/admin') && !pathname.startsWith('/offline-queue') ? 'page' : undefined}>\n              <Icon name={n.icon} />\n              {n.label}\n            <\/Link>\n          ))}\n          {CLOUD && canView('offline_queue', cloud.profile) && (\n            <Link href=\"/offline-queue\" aria-current={pathname.startsWith('/offline-queue') ? 'page' : undefined}>\n              <Icon name=\"list\" />\n              Offline queue\n            <\/Link>\n          )}\n        <\/nav>\n        {isAdmin && (\n          <>\n            <div className=\"side-label\">ADMINISTRATION<\/div>\n            <nav className=\"nav\">\n              <Link href=\"/admin\" aria-current={pathname.startsWith('/admin') ? 'page' : undefined}>\n                <Icon name=\"gear\" />\n                Control panel\n              <\/Link>\n            <\/nav>\n          <\/>\n        )}\n        <div className=\"side-foot\">\n          {CLOUD && cloud.profile ? (\n            <>\n              <Link href=\"/account\" style={{ color: '#fff', textDecoration: 'none' }}><b>{cloud.profile.full_name || cloud.profile.email}<\/b><\/Link>\n              <br />\n              {isAdmin ? 'Super Admin' : 'Staff'} \u00b7 <button className=\"linklike\" style={{ color: 'var(--sand)' }} onClick={() => cloudSignOut(resetDemo).then(() => window.location.replace('/login'))}>Sign out<\/button>\n            <\/>\n          ) : (\n            <>\n              NEAS AI Project Intelligence\n              <br />\n              Preview build \u00b7 data saved on this device\n            <\/>\n          )}\n        <\/div>\n      <\/aside>\n\n      <div className=\"main\">\n        <header className=\"topbar\">\n          <button className=\"btn btn-sm menu-btn\" onClick={() => setOpen((o) => !o)} aria-label=\"Open menu\" aria-expanded={open}>\n            \u2630\n          <\/button>\n          <div>\n            <div className=\"crumb\">NEAS / Project Intelligence<\/div>\n            <div className=\"top-title\">{pathname.startsWith('/admin') ? 'Control panel' : pathname.startsWith('/offline-queue') ? 'Offline queue' : current.label}<\/div>\n          <\/div>\n          <div className=\"top-right\">\n            <span className={`pill ${online ? 'pill-ok' : 'pill-warn'}`} title=\"Network status of this device\">\n              <span className=\"dot\" />\n              {online ? 'Online' : 'Offline \u2014 still saving locally'}\n            <\/span>\n            {persistError ? (\n              <span className=\"pill pill-bad\" title={persistError}>Not saved: storage full or blocked<\/span>\n            ) : (\n              <span className=\"pill hide-sm\" title=\"Saved in this browser\">\n                {ready && saved ? `Saved \u00b7 ${saved}` : 'Device storage'}\n              <\/span>\n            )}\n            {CLOUD ? <CloudPill /> : <SyncPill />}\n          <\/div>\n        <\/header>\n        <main className=\"content\">\n          {blocked ? (\n            <section className=\"card\">\n              <h2 style={{ marginTop: 0 }}>Not available for your account<\/h2>\n              <p className=\"note\">Your administrator has not given you access to this module. Ask them in Control panel \u2192 User directory if you need it.<\/p>\n              <div className=\"form-actions\">{allowedLinks.map(([k, label, href]) => <Link key={k} className=\"btn btn-sm\" href={href}>{label}<\/Link>)}<\/div>\n            <\/section>\n          ) : children}\n        <\/main>\n        <DialogHost />\n      <\/div>\n    <\/div>\n  );\n}\n", "components/WalkthroughReport.tsx": "'use client';\nimport Link from 'next/link';\nimport { useRef, useState } from 'react';\nimport PhotoThumb from '@/components/PhotoThumb';\nimport { notify } from '@/components/Dialogs';\nimport { todayLocal } from '@/lib/calc';\nimport { activityStatus } from '@/lib/fieldStatus';\nimport { fmtDate, fmtPct, uid } from '@/lib/format';\nimport { compressImage, putPhoto } from '@/lib/photos';\nimport type { Activity, Evidence, FieldReport } from '@/lib/types';\n\nconst MAX_BYTES = 5 * 1024 * 1024;\n\nconst latestPhoto = (activityId: string, evidence: Evidence[]) =>\n  evidence.filter((e) => e.activityId === activityId).sort((x, y) => y.takenAt.localeCompare(x.takenAt))[0];\n\n/**\n * Walkthrough \u2192 report: site photos on the left, the draft progress report they feed on the right.\n */\nexport default function WalkthroughReport({\n  pid, projectName, activities, reports, evidence, addEvidence, onPick,\n}: {\n  pid: string;\n  projectName: string;\n  activities: Activity[];\n  reports: FieldReport[];\n  evidence: Evidence[];\n  addEvidence: (e: Evidence) => void;\n  onPick: (activityId: string) => void;\n}) {\n  const day = todayLocal();\n  const fileRef = useRef<HTMLInputElement>(null);\n  const [target, setTarget] = useState(activities[0]?.id ?? '');\n  const [busy, setBusy] = useState(false);\n  const withStatus = activities.map((a) => ({ a, s: activityStatus(a, reports, day), photo: latestPhoto(a.id, evidence) }));\n  const issues = withStatus.filter((x) => x.s.tone === 'warn' || x.s.tone === 'bad').length;\n\n  const takePhoto = (activityId: string) => {\n    setTarget(activityId);\n    fileRef.current?.click();\n  };\n  const savePhotos = async (files: File[]) => {\n    const activityId = target || activities[0]?.id;\n    if (!activityId || !files.length) return;\n    setBusy(true);\n    let ok = 0;\n    const problems: string[] = [];\n    for (const file of files) {\n      if (!file.type.startsWith('image/')) { problems.push(`${file.name}: not an image`); continue; }\n      try {\n        const blob = await compressImage(file);\n        if (blob.size > MAX_BYTES) throw new Error('over 5 MB after compression');\n        const id = uid('ev');\n        await putPhoto(id, blob);\n        addEvidence({ id, projectId: pid, activityId, kind: 'During', caption: file.name.replace(/\\.[^.]+$/, ''), takenAt: new Date().toISOString(), bytes: blob.size });\n        ok++;\n      } catch (e) {\n        problems.push(`${file.name}: ${e instanceof Error ? e.message : 'could not be saved'}`);\n      }\n    }\n    setBusy(false);\n    if (fileRef.current) fileRef.current.value = '';\n    const name = activities.find((a) => a.id === activityId)?.name ?? 'activity';\n    notify(problems.length ? `${ok} photo(s) added to ${name}. ${problems.join('; ')}` : `${ok} photo(s) added to ${name}.`);\n  };\n\n  if (!activities.length) return null;\n\n  return (\n    <section className=\"wt\">\n      <div className=\"wt-hero\">\n        <div>\n          <div className=\"wt-kicker\">Walkthrough \u2192 report<\/div>\n          <h2 className=\"wt-title\">Your site photos become a <span>progress report<\/span><\/h2>\n          <p className=\"wt-sub\">From site walkthrough to draft report, in one place. Works offline; syncs when you are back online.<\/p>\n        <\/div>\n      <\/div>\n\n      <input ref={fileRef} type=\"file\" accept=\"image/*\" capture=\"environment\" multiple hidden onChange={(e) => savePhotos(Array.from(e.target.files ?? []))} />\n\n      <div className=\"wt-split\">\n        <div className=\"wt-phone\" aria-label=\"Walkthrough photos\">\n          <div className=\"wt-phone-head\">\n            <span>Walkthrough in progress<\/span>\n            <span className=\"note\">{fmtDate(day)}<\/span>\n          <\/div>\n          <div className=\"wt-shots\">\n            {withStatus.map(({ a, photo }) => (\n              <figure className=\"wt-shot\" key={a.id}>\n                <figcaption className=\"wt-tag\"><span aria-hidden>\ud83d\udcf7<\/span> {a.name}<\/figcaption>\n                {photo ? (\n                  <PhotoThumb id={photo.id} alt={`${a.name}: ${photo.caption}`} className=\"wt-img\" />\n                ) : (\n                  <button type=\"button\" className=\"wt-img wt-empty\" onClick={() => takePhoto(a.id)}>No photo yet \u00b7 tap to add<\/button>\n                )}\n                <button type=\"button\" className=\"wt-addsmall\" onClick={() => takePhoto(a.id)} disabled={busy} aria-label={`Add photo for ${a.name}`}>\uff0b<\/button>\n              <\/figure>\n            ))}\n          <\/div>\n          <div className=\"wt-phone-foot\">\n            <button type=\"button\" className=\"wt-cam\" onClick={() => takePhoto(target || activities[0].id)} disabled={busy} aria-label=\"Add photo\">\n              <span aria-hidden>\ud83d\udcf7<\/span>\n            <\/button>\n            <span>{busy ? 'Saving\u2026' : 'Add photo'}<\/span>\n          <\/div>\n        <\/div>\n\n        <div className=\"wt-arrows\" aria-hidden><span>\u279c<\/span><span>\u279c<\/span><span>\u279c<\/span><\/div>\n\n        <div className=\"wt-report\" id=\"draft-report\">\n          <div className=\"wt-badge\"><span aria-hidden>\ud83d\udcc4<\/span> Draft report<br />in seconds<\/div>\n          <div className=\"wt-report-head\">\n            <div className=\"eyebrow\">{projectName}<\/div>\n            <h3>Field Progress Report<\/h3>\n            <span className=\"pill\">Draft for review<\/span>\n            {issues > 0 && <span className=\"pill pill-warn\" style={{ marginLeft: 6 }}>{issues} need attention<\/span>}\n          <\/div>\n          <ul className=\"wt-items\">\n            {withStatus.map(({ a, s, photo }) => (\n              <li key={a.id}>\n                <button type=\"button\" className=\"wt-item\" onClick={() => onPick(a.id)} title=\"Record progress for this activity\">\n                  {photo ? <PhotoThumb id={photo.id} alt=\"\" className=\"wt-mini\" /> : <span className=\"wt-mini wt-mini-empty\" aria-hidden>\ud83d\udcf7<\/span>}\n                  <span className=\"wt-item-body\">\n                    <strong>{a.name}<\/strong>\n                    <span className={`chip chip-${s.tone}`}><span aria-hidden>{s.icon}<\/span> {s.label}<\/span>\n                    <span className=\"note\">{s.detail}<\/span>\n                  <\/span>\n                  <span className=\"wt-chev\" aria-hidden>\u203a<\/span>\n                <\/button>\n              <\/li>\n            ))}\n          <\/ul>\n        <\/div>\n      <\/div>\n\n      <div className=\"wt-features\">\n        <div><span className=\"wt-ic\" aria-hidden>\ud83d\udcf7<\/span><span>Photo \u2192<br />Report<\/span><\/div>\n        <div><span className=\"wt-ic\" aria-hidden>\ud83d\udcc4<\/span><span>Exports to PDF,<br />Word &amp; Excel<\/span><\/div>\n        <div><span className=\"wt-ic\" aria-hidden>\ud83c\udfe2<\/span><span>Organized<br />by project<\/span><\/div>\n        <Link className=\"wt-cta\" href=\"#new-report\">Record progress <span aria-hidden>\u203a<\/span><\/Link>\n      <\/div>\n    <\/section>\n  );\n}\n", "docs/DEPLOYMENT.md": "# Deployment, rollback and backup\n\n## 0. Connecting to the existing NEAS app (neas-ai-project-intelligence.vercel.app)\nThe live app (repo `nextedgeaccesssolutions-ra/neas-ai-project-intelligence`, branch `main`) is a static\nHTML app on Supabase project `smlxekhbaefbvdbfxpew`, using tables in `public`. This platform lives in the\nsame repository on branch **`feature/platform-upgrade`**; the old files are kept under `legacy/`.\nIt can share the same Supabase project safely:\n- Every new object is in the `neas` schema and the `neas-project-files` bucket. No `public` table,\n  policy, function, trigger, bucket or user is altered or dropped. Both apps can run side by side.\n- One extra trigger is added on `auth.users` (`neas_on_auth_user_created`). It only writes to `neas.*`\n  and runs next to the old `neas_handle_new_user` trigger; new sign-ups in either app also appear in\n  *Pending approvals* here.\n- Existing records are copied, not moved: `select neas.import_legacy_public();` (database owner only,\n  read-only on `public.*`, safe to re-run). Admins become Super Admins, working roles become active\n  staff, unreviewed `viewer` sign-ups wait for approval. Evidence photos stay in the old bucket.\n\nSteps (take a backup first: Supabase \u2192 Database \u2192 Backups, or `pg_dump`):\n1. Push branch `feature/platform-upgrade`. Vercel builds a **preview** of it automatically; production\n   (`main`) is untouched. `vercel.json` selects the Next.js build for this branch only.\n2. Supabase SQL editor: run migrations `20261018000001` \u2026 `20261018000008` in order, then\n   `select neas.import_legacy_public();` and check the counts it returns.\n3. Supabase \u2192 Settings \u2192 API \u2192 *Exposed schemas*: add `neas`.\n4. Supabase \u2192 Auth \u2192 URL configuration: add `<preview URL>/auth/callback` to redirect URLs.\n5. Vercel \u2192 Settings \u2192 Environment Variables, scope **Preview** (branch `feature/platform-upgrade`):\n   `NEXT_PUBLIC_SUPABASE_URL`, `NEXT_PUBLIC_SUPABASE_ANON_KEY` (the publishable key),\n   `SUPABASE_SERVICE_ROLE_KEY` (secret), `CLIENT_PORTAL_SECRET` (optional; derived from the service-role key when unset), `CRON_SECRET`, and for Sheets\n   `SHEETS_WEBHOOK_URL` / `SHEETS_WEBHOOK_SECRET`. Redeploy the preview.\n   Without the Supabase variables the preview runs in device mode (data on each device).\n6. Run the acceptance checklist (section 3) on the preview with two real accounts.\n7. Production, only after written approval: merge `feature/platform-upgrade` into `main`, copy the\n   variables to the Production scope, set the Auth *Site URL* to the production domain.\n   Rollback = promote the previous production deployment in Vercel (instant); data is unaffected.\n\nCron note: Vercel Hobby allows one cron run per day, so `vercel.json` mirrors to Google Sheets daily\n(02:00 Manila). On Pro, change the schedule to `*/15 * * * *`. Admins can sync any time from\n*Control panel \u2192 Synchronization*.\n\n## 1. Preview first (never straight to production)\n1. Create a **separate** Supabase project (or a Supabase branch) for preview.\n2. Apply migrations in order from `supabase/migrations/` (Supabase SQL editor or `supabase db push`). They only create objects in the new `neas` schema and the `neas-project-files` bucket; they never drop or rewrite existing tables.\n3. Supabase \u2192 Settings \u2192 API \u2192 *Exposed schemas*: add `neas`.\n4. Supabase \u2192 Auth: enable e-mail confirmations; set Site URL to the preview URL; add `<URL>/auth/callback` to redirect URLs; turn on leaked-password protection; consider MFA for admins.\n5. First Super Admin: automatic. When info.nextedgeaccesssolutions@gmail.com registers and verifies the e-mail while no Super Admin exists, it becomes Super Admin (setting `bootstrap_admin_email` in `neas.app_settings`). Everyone after that needs that admin's approval. Manual fallback:\n   ```sql\n   update neas.profiles set global_role = 'super_admin', status = 'active', approved_at = now()\n   where lower(email) = 'info.nextedgeaccesssolutions@gmail.com';\n   ```\n6. Vercel: new project from this repository, branch `feature/platform-upgrade`, environment variables from `.env.example` (preview scope).\n7. Google Sheets: paste `integrations/apps-script-cloud.gs` into the sheet's Apps Script, set `NEAS_HMAC_SECRET`, deploy as web app, put its URL and the same secret in Vercel.\n8. Run the acceptance checklist below on the preview. Only then repeat steps 2\u20137 for production with explicit approval.\n\n## 2. Checks before every release\n```bash\nnpm ci\nnpm test                 # unit tests (calculations, sync engine, validation, client view)\nnpm run test:db          # 125 database security tests on a throwaway PostgreSQL 16\nnpx tsc --noEmit\nnpm run build\ngrep -r \"SUPABASE_SERVICE_ROLE_KEY\\|$SUPABASE_SERVICE_ROLE_KEY\" .next/static && echo \"SECRET LEAK\" || echo \"bundle clean\"\n```\n\n## 3. Acceptance checklist on the preview (with two real accounts)\n- Unverified / unapproved accounts cannot open any project.\n- Employee on project A cannot open project B by URL; manager cannot approve B's reports.\n- Suspend a user \u2192 their next request fails; their queued offline report shows *Sync error*.\n- Offline: file a report and a photo in airplane mode, refresh, reopen \u2192 still there; reconnect \u2192 synced once.\n- Edit the same activity on two devices \u2192 second shows *Conflict detected*.\n- Client: valid passcode works; wrong passcode 5\u00d7 \u2192 locked 15 minutes; rotation ends old sessions; no costs/staff visible.\n- Control panel \u2192 Synchronization \u2192 *Update Google Sheet now* \u2192 sheet tabs refresh; running again reports \u201calready up to date\u201d.\n\n## 4. Rollback\n- **App**: Vercel \u2192 Deployments \u2192 previous deployment \u2192 *Promote to production* (instant).\n- **Database**: migrations are additive. To disable the platform without data loss, revoke API exposure of the `neas` schema. A full removal script is intentionally not provided; dropping the schema deletes data and needs a fresh backup and written approval.\n- **Sheets**: disable the cron (remove `crons` from `vercel.json` or unset `CRON_SECRET`).\n\n## 5. Backup and restore\n- Supabase daily backups (Pro plan) + point-in-time recovery where available.\n- Weekly logical export: `pg_dump --schema=neas --no-owner > neas-YYYYMMDD.sql`, stored outside Supabase.\n- Storage: periodic copy of bucket `neas-project-files`.\n- Restore drill quarterly into a scratch project; run `npm run test:db` style checks against it.\n", "docs/OPERATIONS_MANUAL.md": "# NEAS Project Control \u2014 user and administrator manual\n\n## Everyone\n- **Sign in**: e-mail + password. Forgot it? Use *Forgot password?* \u2014 a single-use link arrives by e-mail.\n- **Status pill (top right)**: *Online \u2014 synchronized*, *Offline \u2014 working locally*, *Pending sync (n)*, *Sync error*, *Conflict detected*. Click it to open the Offline queue.\n- **Working offline**: keep using the app; reports, progress and photos are saved on the device and sent automatically when you reconnect. Do not clear browser data while items are pending.\n- **Conflict**: someone changed the same record. Choose *Keep mine* (send your version on top) or *Use server version*.\n- **Leaving a shared device**: Account \u2192 *Sign out and clear this device*.\n\n## Employees / technicians / inspectors\n1. Request an account (`/register`) \u2192 verify e-mail \u2192 wait for approval \u2192 set your password from the e-mail link.\n2. Field reports: choose activity, date, % complete, notes \u2192 *Save field report*. Add photos in Site evidence.\n3. You can edit your report until a manager reviews it.\n\n## Project managers\n- Project management: activities, dates, weights, latest actual progress.\n- Field reports: *Approve* / *Reject*; tick *client* to show an approved report in the client portal.\n- Estimating & BOQ and Quotation: confidential; quotations follow Draft \u2192 Submitted \u2192 Approved \u2192 Issued.\n\n## Super Admin \u2014 Control panel (`/admin`)\n- **Overview**: counts, pending approvals, client links, sync problems, portfolio planned vs earned value (SPI).\n- **Projects**: create (ID like PRJ-2026-001), suspend, archive, assign team, copy team/client URLs.\n- **Pending approvals**: confirm the person works with NEAS, then approve (they receive a password-setup link) or reject.\n- **Active users**: suspend (immediate), reactivate, send password reset, grant/remove Super Admin.\n- **Invitations**: pre-approve someone for a project; they set their own password.\n- **Client viewer access**: turn the portal on, generate or rotate a passcode (shown once \u2014 share it separately from the link), choose what clients see, review client sign-ins.\n- **Synchronization**: field-device conflicts/errors and the Google Sheet update log; *Update Google Sheet now*.\n- **Audit log**: every administrative and security event.\n\n## Clients\nOpen `https://<app>/client/<PROJECT-ID>`, enter the passcode, view approved progress, schedule, reports and photos. Read-only. Sessions expire; ask NEAS for a new passcode if it stops working.\n\n## User directory (Control panel \u2192 User directory)\nSearch by name, e-mail, job title or project ID; filter by status, role and project. Each row shows\nverified e-mail, account status, approval, global role, projects with project role, last sign-in,\ncreated date, password setup and password reset status. **Export** saves the filtered list as Excel,\nWord, PDF or image.\n\n**Manage** on a row:\n- Approve / Reject (pending registrations), Suspend / Activate.\n- Send password reset \u2014 a single-use link goes to the user; you never see a password. The Reset\n  column shows \"not used yet\" until the user sets a new password, then \"Completed\".\n- Sign out everywhere \u2014 ends all sessions immediately: refresh tokens are deleted and access tokens\n  already issued stop working at the database. Suspending an account does this automatically.\n- Make / Remove Super Admin (never your own role).\n- Project access \u2014 add to a project, change Employee / Project manager, allow report approval, remove.\n- Sign-in and administration history for that person.\n\nSuspended users, or users whose sessions were revoked, are refused by the database itself. Changes\nthey queued offline are refused when the device reconnects and stay on the device marked\n\"Sync error\" for review; they are never applied.\n\n## Sign-up and sign-in rules\n- The owner account **info.nextedgeaccesssolutions@gmail.com** becomes the first Super Admin as soon as it\n  registers and verifies its e-mail (only while no Super Admin exists).\n- Everyone else: register \u2192 verify e-mail \u2192 **wait for the administrator's approval**. The administrator\n  gets an e-mail for each new request (through the Apps Script bridge; script property `ADMIN_EMAIL`).\n- Sign-in is refused until the account is approved and active. The person sees \"waiting for approval\",\n  \"suspended\" or \"not approved\"; every refused sign-in is recorded in the audit log.\n\n## What each employee can see (module access)\nControl panel \u2192 User directory \u2192 Manage \u2192 **Modules this person can use**. Tick the modules (Overview,\nEstimating & BOQ, Quotation, Project management, Field reports, Project register, Site evidence, Google\nSheets setup, Offline queue). Unticked modules disappear from their menu and show \"Not available\" if\nopened by link. The database also enforces it: without Estimating/Quotation they cannot read or change\nBOQ, cost settings or quotations; without Project management they cannot change schedules; without Field\nreports/Project management they cannot submit reports; without Site evidence/Field reports they cannot\nupload photos. Project membership still decides *which projects* they see.\n\n## What each client can see\nControl panel \u2192 Client viewer access \u2192 choose project \u2192 tick what the client portal shows (overview,\nmilestones, progress %, Gantt, S-curve, approved reports, approved photos, approved documents, completion\nstatus). Everything is off by default except the overview; costing, quotations and staff details are never\nshown. Only reports and photos you mark client-visible appear.\n\n## One-time codes (no e-mail needed)\n**Employees**\n- New person: Control panel \u2192 Invitations \u2192 *Add a person with a one-time code* (name, e-mail, project,\n  role, how long the code is valid). The account is created approved and a code like `K7QM-4XTR-9PZH`\n  appears once.\n- Existing or pending person: User directory \u2192 Manage \u2192 *Give one-time sign-in code* (or *Approve and give\n  one-time code*). A new code cancels any earlier unused one.\n- Hand the code over in person, by phone or a separate message. The person opens `/activate`, enters\n  e-mail + code and chooses their own password. The code then stops working. You never see the password.\n- Wrong codes: 5 tries per address or e-mail, then 15 minutes locked. Suspended accounts cannot use codes.\n\n**Clients**\n- Client viewer access \u2192 Type: *One-time (first sign-in only)* or *Reusable until it expires*.\n- *Stay signed in for* 8 hours \u2026 30 days. A one-time passcode opens the portal on one device for that long.\n\n## Working offline and online\n- Employees: after the first online sign-in (activation or password) the app keeps working offline on that\n  device \u2014 schedules, reports, photos and edits are saved locally and sent automatically when the\n  connection returns. Offline use lasts up to the grace period (default 72 hours, `NEXT_PUBLIC_OFFLINE_GRACE_HOURS`);\n  after that the person must go online once to confirm their account is still active.\n- Clients: the portal keeps an offline copy of the approved information from the last online visit and shows\n  when it was saved. Photo files need a connection (their links expire for privacy).\n- Needs a connection: activation with a code, first sign-in, approvals, password resets, module or access\n  changes made by the administrator.\n", "integrations/apps-script-cloud.gs": "/**\n * NEAS AI Project Intelligence \u2192 Google Sheets bridge (cloud version).\n * The web app server signs every request with HMAC-SHA256; this script refuses anything\n * unsigned, stale (> 5 minutes) or already processed (idempotency key).\n *\n * Setup\n * 1. Open the NEAS sheet \u2192 Extensions \u2192 Apps Script \u2192 paste this file \u2192 Save.\n * 2. Project Settings \u2192 Script properties: NEAS_HMAC_SECRET = the same value as the\n *    server's SHEETS_WEBHOOK_SECRET (32+ random characters).\n * 3. Deploy \u2192 New deployment \u2192 Web app \u2192 Execute as: Me \u00b7 Who has access: Anyone.\n * 4. Put the web app URL in the server's SHEETS_WEBHOOK_URL.\n * 5. Optional: script property ADMIN_EMAIL (default info.nextedgeaccesssolutions@gmail.com) receives\n *    \"new registration waiting for approval\" notices. The first run asks you to allow sending mail.\n * The sheet is a reporting copy. Supabase is the system of record.\n */\nconst SHEET_ID = '19e14iR4X8ZLDARO2auYe0Cm4jPoZGUlGvC9O2f9EIAQ';\nconst MAX_SKEW_MS = 5 * 60 * 1000;\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction hex_(bytes) {\n  return bytes.map(function (b) { return ('0' + (b & 0xff).toString(16)).slice(-2); }).join('');\n}\n\nfunction safeEqual_(a, b) {\n  if (a.length !== b.length) return false;\n  var r = 0;\n  for (var i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);\n  return r === 0;\n}\n\nfunction doPost(e) {\n  var secret = PropertiesService.getScriptProperties().getProperty('NEAS_HMAC_SECRET');\n  if (!secret) return json_({ ok: false, error: 'not_configured' });\n  var body;\n  try { body = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'bad_json' }); }\n  var ts = Number(body.ts);\n  if (!ts || Math.abs(Date.now() - ts) > MAX_SKEW_MS) return json_({ ok: false, error: 'stale' });\n  var expected = hex_(Utilities.computeHmacSha256Signature(ts + '.' + body.payload, secret));\n  if (!safeEqual_(expected, String(body.sig || ''))) return json_({ ok: false, error: 'bad_signature' });\n\n  var cache = CacheService.getScriptCache();\n  if (body.key && cache.get('done:' + body.key)) return json_({ ok: true, duplicate: true });\n\n  var data = JSON.parse(body.payload);\n  if (data.notify) {\n    // administrator notice: recipient is fixed here, never taken from the request\n    var to = PropertiesService.getScriptProperties().getProperty('ADMIN_EMAIL') || 'info.nextedgeaccesssolutions@gmail.com';\n    MailApp.sendEmail(to, String(data.notify.subject || 'NEAS notice').slice(0, 150), String(data.notify.text || '').slice(0, 2000));\n    if (body.key) cache.put('done:' + body.key, '1', 3600);\n    return json_({ ok: true, notified: true });\n  }\n  var lock = LockService.getScriptLock();\n  lock.waitLock(25000);\n  try {\n    var ss = SpreadsheetApp.openById(SHEET_ID);\n    var written = 0;\n    Object.keys(data.tabs || {}).forEach(function (name) {\n      if (!/^[A-Za-z_]{1,40}$/.test(name)) return;\n      var grid = data.tabs[name];\n      var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n      sh.clearContents();\n      if (grid.length && grid[0].length) {\n        sh.getRange(1, 1, grid.length, grid[0].length).setValues(grid);\n        written += grid.length - 1;\n      }\n      sh.setFrozenRows(1);\n    });\n    if (body.key) cache.put('done:' + body.key, '1', 21600);\n    return json_({ ok: true, rows: written });\n  } finally {\n    lock.releaseLock();\n  }\n}\n", "lib/cloud/cloudSync.ts": "'use client';\n// Cloud mode engine: hydrates the app from Supabase (RLS-filtered), turns every local change\n// into an outbox operation, and syncs whenever the device is online.\nimport { useSyncExternalStore } from 'react';\nimport type { AppState, Evidence } from '../types';\nimport { supabaseBrowser } from './browser';\nimport { FILES_BUCKET, OFFLINE_GRACE_HOURS } from './env';\nimport * as M from './mapping';\nimport { allOps, enqueue, getMeta, onOutboxChange, processOutbox, setMeta, uuid, type ApplyResult, type Entity, type Operation } from '../offline/outbox';\nimport { getPhoto } from '../photos';\n\nexport type AuthState = 'checking' | 'signed_out' | 'pending' | 'active' | 'offline_grace' | 'expired';\nexport interface Membership { project_id: string; role: 'project_manager' | 'employee'; can_approve_reports: boolean }\nexport interface Profile { id: string; email: string; full_name: string; global_role: 'super_admin' | 'staff'; status: string; email_verified_at: string | null; allowed_views?: string[] | null }\n\nexport interface CloudStatus {\n  auth: AuthState;\n  online: boolean;\n  profile: Profile | null;\n  memberships: Membership[];\n  pending: number;\n  conflicts: number;\n  rejected: number;\n  syncing: boolean;\n  lastSyncAt: string | null;\n  error: string | null;\n}\n\nlet status: CloudStatus = { auth: 'checking', online: true, profile: null, memberships: [], pending: 0, conflicts: 0, rejected: 0, syncing: false, lastSyncAt: null, error: null };\nconst subs = new Set<() => void>();\nconst set = (p: Partial<CloudStatus>) => {\n  status = { ...status, ...p };\n  subs.forEach((f) => f());\n};\nexport const useCloudStatus = () => useSyncExternalStore((f) => (subs.add(f), () => subs.delete(f)), () => status, () => status);\nexport const cloudStatusNow = () => status;\n\n/** Role helpers for the UI (the database enforces the same rules). */\nexport const isSuperAdmin = () => status.profile?.global_role === 'super_admin';\nexport const roleIn = (projectId: string) => (isSuperAdmin() ? 'super_admin' : status.memberships.find((m) => m.project_id === projectId)?.role ?? null);\nexport const canManage = (projectId: string) => isSuperAdmin() || roleIn(projectId) === 'project_manager';\n\n/** Modules the administrator can switch on or off per user (enforced again in the database). */\nexport const VIEWS = [\n  ['overview', 'Overview', '/'], ['estimating', 'Estimating & BOQ', '/estimating'], ['quotation', 'Quotation preview', '/quotation'],\n  ['project_management', 'Project management', '/project-management'], ['field_reports', 'Field reports', '/field-reports'],\n  ['projects', 'Project register', '/projects'], ['site_evidence', 'Site evidence', '/site-evidence'],\n  ['google_sheets', 'Google Sheets setup', '/google-sheets'], ['offline_queue', 'Offline queue', '/offline-queue'],\n] as const;\nexport type ViewKey = (typeof VIEWS)[number][0];\nexport const viewOfPath = (path: string): ViewKey | null => {\n  const hit = VIEWS.filter(([, , href]) => (href === '/' ? path === '/' : path.startsWith(href)));\n  return hit.length ? hit[hit.length - 1][0] : null;\n};\n/** null allowed_views = every module. Super Admins always see everything. */\nexport const canView = (view: ViewKey | null, profile: Profile | null = status.profile) =>\n  !view || !profile || profile.global_role === 'super_admin' || !profile.allowed_views || profile.allowed_views.includes(view);\n\n// ---------------------------------------------------------------------------\ntype Versions = Record<string, { id: string; version: number }>;\nlet versions: Versions = {};\nlet apply: ((s: AppState) => void) | null = null;\nlet read: (() => AppState) | null = null;\nlet timer: ReturnType<typeof setInterval> | null = null;\n\nconst vkey = (entity: Entity, key: string) => `${entity}:${key}`;\n\nasync function refreshCounts() {\n  const ops = await allOps();\n  set({\n    pending: ops.filter((o) => o.status === 'pending' || o.status === 'syncing').length,\n    conflicts: ops.filter((o) => o.status === 'conflict').length,\n    rejected: ops.filter((o) => o.status === 'rejected').leng
